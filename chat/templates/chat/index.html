<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Web UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #3d3d3d;
            padding: 16px 24px;
            border-bottom: 1px solid #cccccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.2rem;
            color: #333;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .username {
            font-size: 0.9rem;
            color: #666;
        }
        .status {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 12px;
            background: #22c55e;
            color: #fff;
        }
        .status.error {
            background: #ef4444;
        }
        .logout-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #6b6b6b;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #525252;
        }
        .chat-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }
        .message.user {
            align-self: flex-end;
            background: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center;
            background: #f0f0f0;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .message.assistant code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }
        .message.assistant pre {
            background: #3d3d3d;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message.assistant pre code {
            background: transparent;
            padding: 0;
            color: #eee;
        }
        .message.assistant h1, .message.assistant h2, .message.assistant h3 {
            margin: 12px 0 8px 0;
            color: #333;
        }
        .message.assistant strong {
            color: #333;
        }
        .message.assistant em {
            color: #666;
        }
        .message.assistant li {
            margin: 4px 0;
            list-style-type: disc;
        }
        .input-area {
            background: #e8e8e8;
            padding: 24px;
            border-top: 1px solid #cccccc;
        }
        .input-form {
            display: flex;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }
        .model-select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            background: #ffffff;
            color: #333;
            font-size: 0.9rem;
            min-width: 200px;
        }
        .message-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            background: #ffffff;
            color: #333;
            font-size: 1rem;
            resize: none;
            min-height: 48px;
            max-height: 200px;
        }
        .message-input:focus {
            outline: none;
            border-color: #6b6b6b;
        }
        .send-btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: #6b6b6b;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #525252;
        }
        .send-btn:disabled {
            background: #a0a0a0;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            padding: 8px 16px;
            border-radius: 8px;
            background: #cccccc;
            color: #666;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .loading.visible {
            display: block;
        }
        .sessions-panel {
            width: 250px;
            background: #e8e8e8;
            border-right: 1px solid #cccccc;
            padding: 16px;
            overflow-y: auto;
        }
        .sessions-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }
        .session-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            font-size: 0.85rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .session-item:hover {
            background: #f5f5f5;
        }
        .session-item.active {
            background: #d4d4d4;
            border-color: #999999;
        }
        .create-session-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: none;
            background: #808080;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .create-session-btn:hover {
            background: #666666;
        }
        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-toggle {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: #6b6b6b;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .sidebar-toggle:hover {
            background: #525252;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LM Studio Web UI</h1>
        <div class="user-info">
            <span class="username" id="username">Гость</span>
            <span id="status" class="status">Загрузка...</span>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </div>
    </div>
    <div class="content-wrapper">
        <div class="sessions-panel" id="sessions-panel">
            <div class="sessions-title">Сессии</div>
            <button id="create-session-btn" class="create-session-btn">Новая сессия</button>
            <div id="sessions-list"></div>
        </div>
        <div class="main-content">
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="loading" id="loading">Модель думает...</div>
            </div>
            <div class="input-area">
                <form id="chat-form" class="input-form">
                    <select id="model-select" class="model-select">
                        <option value="">Выберите модель...</option>
                    </select>
                    <textarea id="message-input" class="message-input" placeholder="Сообщение..." rows="1"></textarea>
                    <button type="submit" id="send-btn" class="send-btn">Отправить</button>
                </form>
                <div class="loading" id="loading"></div>
            </div>
        </div>
    </div>
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const modelSelect = document.getElementById('model-select');
        const sendBtn = document.getElementById('send-btn');
        const loading = document.getElementById('loading');
        const statusEl = document.getElementById('status');
        const usernameEl = document.getElementById('username');
        const logoutBtn = document.getElementById('logout-btn');
        const sessionsPanel = document.getElementById('sessions-panel');
        const sessionsList = document.getElementById('sessions-list');
        const createSessionBtn = document.getElementById('create-session-btn');

        let currentModel = '';
        let conversationHistory = [];
        let currentSessionId = null;
        let isSidebarVisible = true;

        async function checkStatus() {
            try {
                const response = await fetch('/health/');
                const data = await response.json();
                
                console.log('Health check response:', data);
                
                if (data.user) {
                    usernameEl.textContent = data.user;
                    document.querySelector('.logout-btn').style.display = 'block';
                } else {
                    window.location.href = '/login/';
                }
                
                const models = data.models || data.available_models;
                if (models && models.length > 0) {
                    console.log('Models received:', models);
                    modelSelect.innerHTML = '';
                    models.forEach((model, index) => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        if (index === 0) {
                            option.selected = true;
                            currentModel = model;
                        }
                        modelSelect.appendChild(option);
                    });
                    statusEl.textContent = 'LM Studio подключен';
                    statusEl.classList.remove('error');
                } else {
                    statusEl.textContent = 'Нет доступных моделей (model_count: ' + (data.model_count || 0) + ', models: ' + JSON.stringify(models || 'null') + ')';
                    statusEl.classList.add('error');
                    console.error('Models data is empty or missing:', data);
                }
                
                await loadSessions();
            } catch (error) {
                console.error('checkStatus error:', error);
                statusEl.textContent = 'Ошибка подключения';
                statusEl.classList.add('error');
            }
        }

        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions/');
                const data = await response.json();
                
                sessionsList.innerHTML = '';
                data.sessions.forEach(session => {
                    const sessionDiv = document.createElement('div');
                    sessionDiv.className = 'session-item';
                    if (session.session_id === currentSessionId) {
                        sessionDiv.classList.add('active');
                    }
                    sessionDiv.textContent = new Date(session.updated_at).toLocaleString('ru-RU');
                    sessionDiv.addEventListener('click', () => loadSession(session.session_id));
                    sessionsList.appendChild(sessionDiv);
                });
            } catch (error) {
                console.error('Ошибка загрузки сессий:', error);
            }
        }

        async function loadSession(sessionId) {
            try {
                const response = await fetch(`/api/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.content) {
                    currentSessionId = sessionId;
                    conversationHistory = data.messages || [];
                    chatMessages.innerHTML = '';
                    conversationHistory.forEach(msg => {
                        addMessage(msg.role, msg.content);
                    });
                    loadSessions();
                }
            } catch (error) {
                console.error('Ошибка загрузки сессии:', error);
            }
        }

        async function createSession() {
            try {
                const response = await fetch('/api/sessions/create/', {
                    method: 'POST'
                });
                const data = await response.json();
                
                currentSessionId = data.session_id;
                conversationHistory = [];
                chatMessages.innerHTML = '';
                await loadSessions();
            } catch (error) {
                console.error('Ошибка создания сессии:', error);
            }
        }

        async function saveCurrentSession() {
            if (!currentSessionId) return;
            
            try {
                const response = await fetch('/api/sessions/save/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        messages: conversationHistory
                    })
                });
                
                await response.json();
            } catch (error) {
                console.error('Ошибка сохранения сессии:', error);
            }
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            if (role === 'assistant') {
                const markdownContent = content.replace(/`{3}([\s\S]*?)`{3}/g, '<pre><code>$1</code></pre>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                    .replace(/^#\s(.+)/gm, '<h1>$1</h1>')
                    .replace(/^##\s(.+)/gm, '<h2>$1</h2>')
                    .replace(/^###\s(.+)/gm, '<h3>$1</h3>')
                    .replace(/^\-\s(.+)/gm, '<li>$1</li>')
                    .replace(/\n/g, '<br>');
                messageDiv.innerHTML = markdownContent;
            } else {
                messageDiv.textContent = content;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentModel) return;

            addMessage('user', content);
            conversationHistory.push({ role: 'user', content: content });
            messageInput.value = '';
            messageInput.style.height = '48px';
            sendBtn.disabled = true;
            loading.classList.add('visible');

            try {
                const body = {
                    model: currentModel,
                    messages: conversationHistory,
                    temperature: 0.7
                };
                
                if (currentSessionId) {
                    body.session_id = currentSessionId;
                }
                
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                
                if (data.error) {
                    addMessage('system', `Ошибка: ${data.error}`);
                } else {
                    addMessage('assistant', data.content);
                    conversationHistory.push({ role: 'assistant', content: data.content });
                    
                    if (data.session_id && !currentSessionId) {
                        currentSessionId = data.session_id;
                        await loadSessions();
                    } else if (currentSessionId) {
                        await saveCurrentSession();
                    }
                }
            } catch (error) {
                addMessage('system', `Ошибка сети: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                loading.classList.remove('visible');
                messageInput.focus();
            }
        }

        messageInput.addEventListener('input', function() {
            this.style.height = '48px';
            this.style.height = this.scrollHeight + 'px';
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        modelSelect.addEventListener('change', (e) => {
            currentModel = e.target.value;
            conversationHistory = [];
            chatMessages.innerHTML = '';
            currentSessionId = null;
            loadSessions();
        });

        createSessionBtn.addEventListener('click', createSession);
        
        logoutBtn.addEventListener('click', async () => {
            try {
                await fetch('/logout/', {
                    method: 'POST'
                });
                window.location.href = '/login/';
            } catch (error) {
                window.location.href = '/login/';
            }
        });

        checkStatus();
    </script>
</body>
</html>

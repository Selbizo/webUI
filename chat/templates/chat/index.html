        workspaceFolderInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                const firstFile = e.target.files[0];
                const folderPath = firstFile.webkitRelativePath.split('/')[0];
                workspacePathInput.value = folderPath;
            }
        });
        
        workspaceApplyBtn.addEventListener('click', async () => {
            const path = workspacePathInput.value.trim();
            if (!path) {
                workspaceError.textContent = 'Введите путь к папке';
                workspaceError.style.display = 'block';
                return;
            }
            
            workspaceApplyBtn.disabled = true;
            workspaceApplyBtn.textContent = 'Применение...';
            workspaceError.style.display = 'none';
            workspaceSuccess.style.display = 'none';
            
            try {
                const response = await fetch('/api/workspace/set/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ path: path })
                });
                const data = await response.json();
                
                if (data.success) {
                    workspaceSuccess.textContent = '✅ Рабочая папка изменена на: ' + data.path;
                    workspaceSuccess.style.display = 'block';
                    currentWorkspacePath.textContent = data.path;
                    
                    setTimeout(() => {
                        hideWorkspaceModal();
                        loadFileTree();
                    }, 1500);
                } else {
                    workspaceError.textContent = '❌ ' + data.error;
                    workspaceError.style.display = 'block';
                }
            } catch (error) {
                workspaceError.textContent = '❌ Ошибка: ' + error.message;
                workspaceError.style.display = 'block';
            } finally {
                workspaceApplyBtn.disabled = false;
                workspaceApplyBtn.textContent = 'Применить';
            }
        });
        
        workspaceCancelBtn.addEventListener('click', hideWorkspaceModal);
        
        workspaceModal.addEventListener('click', (e) => {
            if (e.target === workspaceModal) {
                hideWorkspaceModal();
            }
        });
        
        document.getElementById('set-workspace-btn').addEventListener('click', showWorkspaceModal);
        
        logoutBtn.addEventListener('click', async () => {
            if (currentSessionId) {
                await saveCurrentSession();
            }
            try {
                await fetch('/logout/', {
                    method: 'POST'
                });
                window.location.href = '/login/';
            } catch (error) {
                window.location.href = '/login/';
            }
        });

        // Directory load modal handlers
        const loadDirModal = document.getElementById('load-dir-modal');
        const loadDirPath = document.getElementById('load-dir-path');
        const loadDirMaxFiles = document.getElementById('load-dir-max-files');
        const loadDirMaxSize = document.getElementById('load-dir-max-size');
        const loadDirLoadBtn = document.getElementById('load-dir-load-btn');
        const loadDirCancelBtn = document.getElementById('load-dir-cancel-btn');
        const loadDirError = document.getElementById('load-dir-error');
        const loadDirSuccess = document.getElementById('load-dir-success');
        const loadDirProgress = document.getElementById('load-dir-progress');
        const loadDirProgressBar = document.getElementById('load-dir-progress-bar');
        const loadDirProgressText = document.getElementById('load-dir-progress-text');
        let isDirLoading = false;
        let loadedDirPaths = new Set();

        function showLoadDirModal() {
            loadDirModal.style.display = 'flex';
            loadDirError.style.display = 'none';
            loadDirSuccess.style.display = 'none';
            loadDirProgress.style.display = 'none';
            const workspaceInfo = document.getElementById('workspace-info');
            const defaultPath = workspaceInfo ? workspaceInfo.textContent.replace('📁 ', '').trim() : '';
            loadDirPath.value = defaultPath;
        }

        function hideLoadDirModal() {
            loadDirModal.style.display = 'none';
            isDirLoading = false;
        }

        async function loadDirectoryIntoContext() {
            if (isDirLoading) return;
            
            const dirPath = loadDirPath.value.trim();
            if (!dirPath) {
                loadDirError.textContent = 'Введите путь к директории';
                loadDirError.style.display = 'block';
                return;
            }

            isDirLoading = true;
            loadDirLoadBtn.disabled = true;
            loadDirLoadBtn.textContent = 'Загрузка...';
            loadDirError.style.display = 'none';
            loadDirSuccess.style.display = 'none';
            loadDirProgress.style.display = 'block';
            loadDirProgressBar.style.width = '30%';
            loadDirProgressText.textContent = 'Отправка запроса...';

            try {
                const response = await fetch('/api/files/load-dir/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        path: dirPath,
                        max_files: parseInt(loadDirMaxFiles.value),
                        max_total_size_mb: parseInt(loadDirMaxSize.value)
                    })
                });

                loadDirProgressBar.style.width = '70%';
                loadDirProgressText.textContent = 'Обработка ответа...';

                const data = await response.json();

                if (data.error) {
                    loadDirError.textContent = '❌ ' + data.error;
                    loadDirError.style.display = 'block';
                    loadDirProgress.style.display = 'none';
                    return;
                }

                // Add all files to context
                let addedCount = 0;
                for (const file of data.files) {
                    if (!selectedFilesForContext.includes(file.path)) {
                        selectedFilesForContext.push(file.path);
                        loadedDirPaths.add(dirPath);
                        addedCount++;
                    }
                }

                loadDirProgressBar.style.width = '100%';
                loadDirProgressText.textContent = 'Готово!';

                updateContextBadge();
                
                loadDirSuccess.textContent = `✅ Загружено ${addedCount} файлов из "${dirPath}" (всего в контексте: ${selectedFilesForContext.length})`;
                loadDirSuccess.style.display = 'block';

                setTimeout(() => {
                    hideLoadDirModal();
                }, 2000);

            } catch (error) {
                loadDirError.textContent = '❌ Ошибка: ' + error.message;
                loadDirError.style.display = 'block';
                loadDirProgress.style.display = 'none';
            } finally {
                isDirLoading = false;
                loadDirLoadBtn.disabled = false;
                loadDirLoadBtn.textContent = 'Загрузить';
            }
        }

        loadDirLoadBtn.addEventListener('click', loadDirectoryIntoContext);
        loadDirCancelBtn.addEventListener('click', hideLoadDirModal);
        loadDirModal.addEventListener('click', (e) => {
            if (e.target === loadDirModal) {
                hideLoadDirModal();
            }
        });
        
        document.getElementById('load-dir-btn').addEventListener('click', showLoadDirModal);

        checkStatus();

// ========== Vector DB / RAG Panel ==========
const vectorDbPanel = document.getElementById('vector-db-panel');
const toggleVectorDbBtn = document.getElementById('toggle-vector-db-btn');
const vectorDbList = document.getElementById('vector-db-list');
const createDbBtn = document.getElementById('create-db-btn');
const vectorDbActions = document.getElementById('vector-db-actions');
const uploadFileBtn = document.getElementById('upload-file-btn');
const indexBtn = document.getElementById('index-btn');
const vectorDbInfo = document.getElementById('vector-db-info');
const ragStatus = document.getElementById('rag-status');
const fileInput = document.getElementById('file-input');

let currentDbName = null;
let activeDbName = null;

// Toggle panel
if (toggleVectorDbBtn && vectorDbPanel) {
    toggleVectorDbBtn.addEventListener('click', () => {
        vectorDbPanel.classList.toggle('visible');
    });
}

async function loadVectorDatabases() {
    console.log('loadVectorDatabases called');
    try {
        const response = await fetch('/api/vector-db/list/');
        console.log('Vector DB list response status:', response.status);
        const data = await response.json();
        console.log('Vector DB list response:', data);
        
        vectorDbList.innerHTML = '';
        
        if (!data.databases || data.databases.length === 0) {
            vectorDbList.innerHTML = '<div style="font-size:0.78rem;color:var(--text-secondary);padding:8px;">Нет баз данных</div>';
            vectorDbActions.style.display = 'none';
            vectorDbInfo.style.display = 'none';
            return;
        }
        
        data.databases.forEach(db => {
            const item = document.createElement('div');
            item.className = 'vector-db-item';
            if (db.name === currentDbName) item.classList.add('active');
            
            const statusClass = db.index_ready ? 'ready' : 'pending';
            const statusText = db.index_ready ? 'Готов' : 'Нет индекса';
            
            item.innerHTML = `
                <span class="db-name">${db.name}</span>
                <span class="db-status ${statusClass}">${statusText}</span>
            `;
            
            item.addEventListener('click', () => selectDatabase(db.name));
            vectorDbList.appendChild(item);
        });
    } catch (error) {
        console.error('Ошибка загрузки БД:', error);
    }
}

async function selectDatabase(name) {
    currentDbName = name;
    loadVectorDatabases();
    
    try {
        const response = await fetch('/api/vector-db/info/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name})
        });
        const data = await response.json();
        
        if (data.info) {
            const info = data.info;
            vectorDbInfo.style.display = 'block';
            vectorDbActions.style.display = 'flex';
            vectorDbInfo.innerHTML = `
                <div><strong>${info.name}</strong></div>
                <div>Создана: ${new Date(info.created_at).toLocaleDateString('ru-RU')}</div>
                <div>Документов: ${info.documents.length}</div>
                <div>Чанков: ${info.total_chunks || 0}</div>
                <div>Размерность: ${info.embedding_dimensions || 0}</div>
            `;
        }
    } catch (error) {
        console.error('Ошибка получения информации:', error);
    }
}

// Create DB Modal handlers
const createDbModal = document.getElementById('create-db-modal');
const dbNameInput = document.getElementById('db-name-input');
const createDbError = document.getElementById('create-db-error');
const createDbSuccess = document.getElementById('create-db-success');
const createDbApplyBtn = document.getElementById('create-db-apply-btn');
const createDbCancelBtn = document.getElementById('create-db-cancel-btn');

function showCreateDbModal() {
    createDbModal.style.display = 'flex';
    createDbError.style.display = 'none';
    createDbSuccess.style.display = 'none';
    dbNameInput.value = '';
    dbNameInput.focus();
}

function hideCreateDbModal() {
    createDbModal.style.display = 'none';
    createDbError.style.display = 'none';
    createDbSuccess.style.display = 'none';
}

if (createDbBtn) {
    createDbBtn.addEventListener('click', async (e) => {
        console.log('✅ Create DB button clicked');
        showCreateDbModal();
    });
}

if (createDbApplyBtn) {
    createDbApplyBtn.addEventListener('click', async () => {
        const name = dbNameInput.value.trim();
        console.log('User entered name:', name);
        
        if (!name) {
            createDbError.textContent = 'Введите имя базы данных';
            createDbError.style.display = 'block';
            createDbSuccess.style.display = 'none';
            return;
        }
        
        if (!/^[a-zA-Z0-9_\-]+$/.test(name)) {
            createDbError.textContent = 'Имя может содержать только буквы, цифры, _ и -';
            createDbError.style.display = 'block';
            createDbSuccess.style.display = 'none';
            return;
        }
        
        createDbApplyBtn.disabled = true;
        createDbApplyBtn.textContent = 'Создание...';
        createDbError.style.display = 'none';
        createDbSuccess.style.display = 'none';
        
        try {
            const response = await fetch('/api/vector-db/create/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({name: name})
            });
            const data = await response.json();
            
            if (data.success) {
                createDbSuccess.textContent = '✅ База "' + name + '" создана успешно!';
                createDbSuccess.style.display = 'block';
                createDbError.style.display = 'none';
                
                await loadVectorDatabases();
                selectDatabase(name);
                
                setTimeout(() => {
                    hideCreateDbModal();
                }, 1500);
            } else {
                createDbError.textContent = '❌ ' + (data.error || 'Ошибка создания');
                createDbError.style.display = 'block';
                createDbSuccess.style.display = 'none';
            }
        } catch (error) {
            createDbError.textContent = '❌ Ошибка: ' + error.message;
            createDbError.style.display = 'block';
            createDbSuccess.style.display = 'none';
        } finally {
            createDbApplyBtn.disabled = false;
            createDbApplyBtn.textContent = 'Создать';
        }
    });
}

if (createDbCancelBtn) {
    createDbCancelBtn.addEventListener('click', hideCreateDbModal);
}

createDbModal.addEventListener('click', (e) => {
    if (e.target === createDbModal) {
        hideCreateDbModal();
    }
});

// Enter key support
if (dbNameInput) {
    dbNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            createDbApplyBtn.click();
        }
    });
}


if (uploadFileBtn) {
    uploadFileBtn.addEventListener('click', () => {
        if (fileInput) fileInput.click();
    });
}

if (fileInput) {
    fileInput.addEventListener('change', async (e) => {
        if (!currentDbName || !e.target.files || e.target.files.length === 0) return;
        
        for (const file of e.target.files) {
            const formData = new FormData();
            formData.append('db_name', currentDbName);
            formData.append('file', file);
            
            try {
                const response = await fetch('/api/vector-db/upload-file/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    await loadVectorDatabases();
                    selectDatabase(currentDbName);
                } else {
                    alert('Ошибка загрузки: ' + data.error);
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
        fileInput.value = '';
    });
}

if (indexBtn) {
    indexBtn.addEventListener('click', async () => {
        if (!currentDbName) return;
        
        indexBtn.disabled = true;
        indexBtn.textContent = '⏳ Индексация...';
        
        try {
            const response = await fetch('/api/vector-db/index/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: currentDbName})
            });
            const data = await response.json();
            
            if (data.success) {
                alert(`Индекс построен!\nФайлов: ${data.files_indexed}\nЧанков: ${data.total_chunks}`);
                await loadVectorDatabases();
                selectDatabase(currentDbName);
            } else {
                alert('Ошибка: ' + data.error);
            }
        } catch (error) {
            alert('Ошибка индексации: ' + error.message);
        } finally {
            indexBtn.disabled = false;
            indexBtn.textContent = '🔬';
        }
    });
}

async function activateRagDb(name) {
    activeDbName = name;
    ragStatus.style.display = 'block';
    ragStatus.className = 'rag-status visible rag-activated';
    ragStatus.textContent = `🧠 RAG активен: ${name}`;
    localStorage.setItem('activeRagDb', name);
}

function deactivateRagDb() {
    activeDbName = null;
    ragStatus.style.display = 'block';
    ragStatus.className = 'rag-status visible rag-inactive';
    ragStatus.textContent = '🧠 RAG деактивирован';
    localStorage.removeItem('activeRagDb');
}

// Check if RAG is activated from URL params
if (currentDbName) {
    activateRagDb(currentDbName);
}

const savedRagDb = localStorage.getItem('activeRagDb');
if (savedRagDb) {
    setTimeout(() => activateRagDb(savedRagDb), 1000);
}

// Override sendMessage to include RAG context
const originalSendMessage = window.sendMessage;
window.sendMessage = async function() {
    let query = messageInput.value.trim();
    if (!query) return;
    
    let ragContext = '';
    if (activeDbName && query) {
        try {
            const response = await fetch('/api/vector-db/search/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: activeDbName,
                    query: query,
                    top_k: 5
                })
            });
            const data = await response.json();
            
            if (data.results && data.results.length > 0) {
                ragContext = '\n\n=== КОНТЕКСТ ИЗ ВЕКТОРНОЙ БАЗЫ ===\n';
                data.results.forEach((result, i) => {
                    const source = result.metadata?.file_name || 'Неизвестно';
                    ragContext += `[${i+1}. Источник: ${source},相似度: ${result.score.toFixed(3)}]\n${result.chunk}\n\n`;
                });
                ragContext += '=== КОНЕЦ КОНТЕКСТА ===\n';
            }
        } catch (error) {
            console.error('RAG search error:', error);
        }
    }
    
    if (ragContext) {
        messageInput.value = query + ragContext;
    }
    
    if (originalSendMessage) {
        await originalSendMessage();
    }
};

// Init
loadVectorDatabases();
        initWorkspaceInfo();
    </script>
</body>

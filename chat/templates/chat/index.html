<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Web UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e8e8e8;
            --bg-tertiary: #ffffff;
            --bg-header: #3d3d3d;
            --bg-input: #ffffff;
            --bg-message-user: #e0e0e0;
            --bg-message-assistant: #ffffff;
            --bg-message-system: #f0f0f0;
            --bg-code: #3d3d3d;
            --bg-code-header: #2d2d3d;
            --bg-code-inline: #e8e8e8;
            --bg-modal-overlay: rgba(0,0,0,0.5);
            --bg-modal-content: #fff;
            --bg-hover: #f5f5f5;
            --bg-active: #d4d4d4;
            --bg-line-hover: #f0f0f0;
            --bg-file-viewer: #fff;
            --bg-file-viewer-line: transparent;
            --bg-terminal: #1e1e1e;
            --bg-suggestion: #fff;
            --bg-progress-bar: #22c55e;
            --bg-progress-track: #e0e0e0;
            --bg-diff-added: #e6ffec;
            --bg-diff-removed: #ffebe9;
            --bg-diff-hunk: #f0f0f0;
            --bg-diff-number: transparent;
            --bg-btn-secondary: #fff;
            --bg-btn-apply: #10b981;
            --bg-btn-apply-hover: #059669;
            --bg-btn-disabled: #a0a0a0;
            --bg-success: #d1fae5;
            --bg-error: #fee2e2;
            --bg-loading: #cccccc;
            --bg-loader-track: #e0e0e0;

            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #999;
            --text-on-dark: #fff;
            --text-on-dark-secondary: #aaa;
            --text-code: #eee;
            --text-link: #e74c3c;
            --text-diff-added: #1a7f37;
            --text-diff-removed: #cf222e;
            --text-diff-hunk: #666;
            --text-diff-header: #999;

            --border-primary: #cccccc;
            --border-secondary: #e0e0e0;
            --border-tertiary: #ddd;
            --border-active: #999999;

            --shadow-modal: 0 10px 40px rgba(0,0,0,0.3);
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-header: #010409;
            --bg-input: #21262d;
            --bg-message-user: #1c2333;
            --bg-message-assistant: #161b22;
            --bg-message-system: #1c2333;
            --bg-code: #1a1e24;
            --bg-code-header: #0d1117;
            --bg-code-inline: #30363d;
            --bg-modal-overlay: rgba(0,0,0,0.7);
            --bg-modal-content: #161b22;
            --bg-hover: #1c2333;
            --bg-active: #30363d;
            --bg-line-hover: #1c2333;
            --bg-file-viewer: #0d1117;
            --bg-file-viewer-line: transparent;
            --bg-terminal: #0d1117;
            --bg-suggestion: #161b22;
            --bg-progress-bar: #238636;
            --bg-progress-track: #30363d;
            --bg-diff-added: #0d2818;
            --bg-diff-removed: #2d1013;
            --bg-diff-hunk: #161b22;
            --bg-diff-number: transparent;
            --bg-btn-secondary: #21262d;
            --bg-btn-apply: #238636;
            --bg-btn-apply-hover: #2ea043;
            --bg-btn-disabled: #30363d;
            --bg-success: #0d2818;
            --bg-error: #2d1013;
            --bg-loading: #30363d;
            --bg-loader-track: #30363d;

            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-tertiary: #484f58;
            --text-on-dark: #fff;
            --text-on-dark-secondary: #8b949e;
            --text-code: #e6edf3;
            --text-link: #f85149;
            --text-diff-added: #3fb950;
            --text-diff-removed: #f85149;
            --text-diff-hunk: #8b949e;
            --text-diff-header: #484f58;

            --border-primary: #30363d;
            --border-secondary: #30363d;
            --border-tertiary: #21262d;
            --border-active: #58a6ff;

            --shadow-modal: 0 10px 40px rgba(0,0,0,0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }
        .header {
            background: var(--bg-header);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.2rem;
            color: var(--text-primary);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .username {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .status {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 12px;
            background: #22c55e;
            color: #fff;
        }
        .status.error {
            background: #ef4444;
        }
        .theme-toggle {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-primary);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--border-active);
        }
        .logout-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid var(--border-primary);
        }
        .logout-btn:hover {
            background: var(--bg-hover);
        }
        .chat-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }
        .message.user {
            align-self: flex-end;
            background: var(--bg-message-user);
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-message-assistant);
            border: 1px solid var(--border-secondary);
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center;
            background: var(--bg-message-system);
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .message.assistant code {
            background: var(--bg-code-inline);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            color: var(--text-primary);
        }
        .message.assistant pre {
            background: var(--bg-code);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message.assistant pre code {
            background: transparent;
            padding: 0;
            color: var(--text-code);
        }
        .message.assistant h1, .message.assistant h2, .message.assistant h3 {
            margin: 12px 0 8px 0;
            color: var(--text-primary);
        }
        .message.assistant strong {
            color: var(--text-primary);
        }
        .message.assistant em {
            color: var(--text-secondary);
        }
        .message.assistant li {
            margin: 4px 0;
            list-style-type: disc;
        }
        .input-area {
            background: var(--bg-secondary);
            padding: 24px;
            border-top: 1px solid var(--border-primary);
            flex-shrink: 0;
        }
        .input-form {
            display: flex;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }
        .model-select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-primary);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.9rem;
            min-width: 200px;
        }
        .message-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-primary);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            min-height: 48px;
            max-height: 200px;
        }
        .message-input:focus {
            outline: none;
            border-color: var(--border-active);
        }
        .send-btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid var(--border-primary);
        }
        .send-btn:hover {
            background: var(--bg-hover);
        }
        .send-btn:disabled {
            background: var(--bg-btn-disabled);
            cursor: not-allowed;
        }
        .loading {
            display: none;
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--bg-loading);
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .loading.visible {
            display: block;
        }
        .sessions-panel {
            width: 250px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            padding: 16px;
            overflow-y: auto;
        }
        .sessions-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .session-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            color: var(--text-primary);
        }
        .session-item .session-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .session-item .delete-session-btn {
            flex-shrink: 0;
            margin-left: 8px;
            padding: 2px 6px;
            border: none;
            background: #ef4444;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .session-item:hover {
            background: var(--bg-hover);
        }
        .session-item.active {
            background: var(--bg-active);
            border-color: var(--border-active);
        }
        .create-session-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid var(--border-primary);
        }
        .create-session-btn:hover {
            background: var(--bg-hover);
        }
        .delete-session-btn:hover {
            background: #dc2626;
        }
        .file-panel {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .file-panel.visible {
            display: block;
        }
        .file-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .file-panel-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-primary);
        }
        .file-tree {
            font-size: 0.82rem;
        }
        .file-tree-item {
            user-select: none;
        }
        .file-tree-row {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            gap: 4px;
            color: var(--text-primary);
        }
        .file-tree-row:hover {
            background: var(--bg-hover);
        }
        .file-tree-row.open {
            background: var(--bg-active);
        }
        .file-tree-row.file {
            padding-left: 20px;
        }
        .file-tree-row.file:hover {
            color: var(--text-secondary);
        }
        .file-tree-row.active {
            background: var(--bg-active);
            color: var(--text-primary);
        }
        .file-tree-arrow {
            width: 16px;
            text-align: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            color: var(--text-tertiary);
        }
        .file-tree-arrow.hidden {
            visibility: hidden;
        }
        .file-tree-icon {
            margin-right: 4px;
            font-size: 0.85rem;
        }
        .file-tree-children {
            display: none;
        }
        .file-tree-children.open {
            display: block;
        }
        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .content-main {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }
        .file-viewer {
            display: none;
            flex-direction: column;
            width: 400px;
            border-right: 1px solid var(--border-primary);
            background: var(--bg-file-viewer);
            overflow: hidden;
            flex-shrink: 0;
        }
        .file-viewer.visible {
            display: flex;
        }
        .file-viewer-header {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: bold;
            color: var(--text-primary);
        }
        .file-viewer-close {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-tertiary);
            padding: 0 4px;
        }
        .file-viewer-close:hover {
            color: var(--text-primary);
        }
        .file-viewer-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            background: var(--bg-primary);
        }
        .file-viewer-line {
            display: flex;
            white-space: pre;
        }
        .file-viewer-line:hover {
            background: var(--bg-line-hover);
        }
        .line-number {
            display: inline-block;
            width: 40px;
            text-align: right;
            padding-right: 12px;
            color: var(--text-tertiary);
            user-select: none;
            border-right: 1px solid var(--border-secondary);
            flex-shrink: 0;
        }
        .line-content {
            padding-left: 12px;
            color: var(--text-primary);
        }
        .file-viewer-content code {
            background: var(--bg-code);
            color: var(--text-code);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
        }
        .file-viewer-content pre {
            background: var(--bg-code);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            color: var(--text-code);
        }
        .code-block {
            display: flex;
            flex-direction: column;
            margin: 8px 0;
            background: var(--bg-code);
            border-radius: 8px;
            overflow: hidden;
        }
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: var(--bg-code-header);
            color: var(--text-on-dark-secondary);
            font-size: 0.75rem;
        }
        .code-block-copy {
            background: none;
            border: none;
            color: var(--text-on-dark-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .code-block-copy:hover {
            background: var(--bg-active);
        }
        .code-block-content {
            display: flex;
            flex-direction: column;
        }
        .diff-viewer {
            display: none;
            flex-direction: column;
            width: 450px;
            border-right: 1px solid var(--border-primary);
            background: var(--bg-file-viewer);
            overflow: hidden;
            flex-shrink: 0;
        }
        .diff-viewer.visible {
            display: flex;
        }
        .diff-viewer-header {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: bold;
            color: var(--text-primary);
        }
        .diff-viewer-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            background: var(--bg-primary);
        }
        .diff-line {
            display: flex;
            white-space: pre;
            padding: 0 8px;
        }
        .diff-line:hover {
            background: var(--bg-line-hover);
        }
        .diff-line.added {
            background: var(--bg-diff-added);
        }
        .diff-line.added .diff-number { background: var(--bg-diff-added); }
        .diff-line.removed {
            background: var(--bg-diff-removed);
        }
        .diff-line.removed .diff-number { background: var(--bg-diff-removed); }
        .diff-line.hunk {
            background: var(--bg-diff-hunk);
            color: var(--text-diff-hunk);
        }
        .diff-line.header {
            background: var(--bg-diff-hunk);
            color: var(--text-diff-header);
        }
        .diff-number {
            display: inline-block;
            width: 35px;
            text-align: right;
            padding-right: 8px;
            color: var(--text-tertiary);
            user-select: none;
            border-right: 1px solid var(--border-secondary);
            flex-shrink: 0;
        }
        .diff-content {
            padding-left: 8px;
        }
        .diff-content.added-text { color: var(--text-diff-added); }
        .diff-content.removed-text { color: var(--text-diff-removed); }
        .diff-actions {
            padding: 8px 12px;
            border-top: 1px solid var(--border-tertiary);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            background: var(--bg-secondary);
        }
        .btn-apply {
            padding: 4px 12px;
            border-radius: 4px;
            border: none;
            background: var(--bg-btn-apply);
            color: #fff;
            cursor: pointer;
            font-size: 0.82rem;
        }
        .btn-apply:hover {
            background: var(--bg-btn-apply-hover);
        }
        .btn-reject {
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-primary);
            background: var(--bg-btn-secondary);
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text-primary);
        }
        .btn-reject:hover {
            background: var(--bg-hover);
        }
        .code-block-header {
            padding: 12px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--text-code);
            white-space: pre;
        }
        .search-files {
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-primary);
            font-size: 0.82rem;
            margin-bottom: 8px;
            background: var(--bg-input);
            color: var(--text-primary);
            display: none;
        }
        .search-files.visible {
            display: block;
        }
        .sidebar-toggle {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-primary);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .sidebar-toggle:hover {
            background: var(--bg-hover);
        }
        .btn-secondary {
            padding: 8px 16px;
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            background: var(--bg-btn-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
        }
        .btn-apply {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: var(--bg-btn-apply);
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-apply:hover {
            background: var(--bg-btn-apply-hover);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-content {
            background: var(--bg-modal-content);
            border-radius: 12px;
            padding: 24px;
            min-width: 450px;
            max-width: 600px;
            box-shadow: var(--shadow-modal);
            color: var(--text-primary);
        }

        /* Vector DB Panel */
        .vector-db-panel {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
            display: block;
        }
        .vector-db-panel.visible {
            display: block;
        }
        .vector-db-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .vector-db-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
        }
        .vector-db-item:hover {
            background: var(--bg-hover);
        }
        .vector-db-item.active {
            background: var(--bg-active);
            border-color: var(--border-active);
        }
        .vector-db-item .db-name {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .vector-db-item .db-status {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .vector-db-item .db-status.ready {
            background: #22c55e;
            color: white;
        }
        .vector-db-item .db-status.pending {
            background: #f59e0b;
            color: white;
        }
        .create-db-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid var(--border-primary);
        }
        .create-db-btn:hover {
            background: var(--bg-hover);
        }
        .db-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .db-actions button {
            flex: 1;
            min-width: 80px;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-primary);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .db-actions button:hover {
            background: var(--bg-hover);
        }
        .db-actions button:disabled {
            background: var(--bg-btn-disabled);
            cursor: not-allowed;
        }
        .db-info {
            margin-top: 12px;
            padding: 10px;
            background: var(--bg-message-system);
            border-radius: 6px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .db-info div {
            margin-bottom: 4px;
        }
        .file-upload-area {
            margin-top: 12px;
            padding: 12px;
            border: 2px dashed var(--border-primary);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-upload-area:hover {
            border-color: var(--border-active);
        }
        .file-upload-area input[type="file"] {
            display: none;
        }
        .rag-status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            display: none;
        }
        .rag-status.visible {
            display: block;
        }
        .rag-activated {
            background: var(--bg-success);
            color: var(--text-diff-added);
        }
        .rag-inactive {
            background: var(--bg-error);
            color: var(--text-diff-removed);
        }
        .search-results {
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .search-result-item {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            font-size: 0.75rem;
            color: var(--text-primary);
        }
        .search-result-item .score {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LM Studio Web UI</h1>
        <div class="user-info">
            <span id="status" class="status">Загрузка...</span>
            <button id="theme-toggle" class="theme-toggle" title="Переключить тему">🌙</button>
            <button id="toggle-vector-db-btn" class="theme-toggle" title="Векторные базы (RAG)">🧠</button>
            <span class="username" id="username">Гость</span>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </div>
    </div>
    <div class="content-wrapper">
        <div class="vector-db-panel" id="vector-db-panel">
            <div class="vector-db-title">🧠 Векторные базы</div>
            <button id="create-db-btn" class="create-db-btn">+ Создать базу</button>
            <div id="vector-db-list"></div>
            <div id="vector-db-actions" class="db-actions" style="display:none;">
                <button id="upload-file-btn" title="Загрузить файлы">📁</button>
                <button id="index-btn" title="Построить индекс">🔬</button>
            </div>
            <div id="vector-db-info" class="db-info" style="display:none;"></div>
            <input type="file" id="file-input" multiple style="display:none;" accept=".txt,.md,.json,.csv,.docx,.pdf,.xlsx,.xls">
            <div id="rag-status" class="rag-status"></div>
        </div>
        <div class="sessions-panel" id="sessions-panel">
            <div class="sessions-title">Сессии</div>
            <button id="create-session-btn" class="create-session-btn">Новая сессия</button>
            <div id="sessions-list"></div>
        </div>
        <div class="file-panel" id="file-panel">
            <div class="file-panel-header">
                <span class="file-panel-title">Файлы</span>
                <div>
                    <button id="set-workspace-btn" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;" title="Выбрать папку">📂</button>
                    <button id="load-dir-btn" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;" title="Загрузить директорию в контекст">📚</button>
                    <button id="search-files-btn" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;" title="Поиск">🔍</button>
                    <button id="toggle-file-panel" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;margin-left:2px;" title="Закрыть">✕</button>
                </div>
            </div>
            <div id="workspace-info" style="font-size:0.75rem;color:var(--text-secondary);padding:4px 0;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title=""></div>
            <input type="text" class="search-files" id="search-files" placeholder="Поиск файлов...">
            <div class="file-tree" id="file-tree"></div>
        </div>
        <div class="diff-viewer" id="diff-viewer">
            <div class="diff-viewer-header">
                <span id="diff-viewer-name">—</span>
                <button class="file-viewer-close" id="diff-viewer-close">×</button>
            </div>
            <div class="diff-viewer-content" id="diff-viewer-content"></div>
            <div class="diff-actions">
                <button class="btn-reject" id="diff-reject">Отклонить</button>
                <button class="btn-apply" id="diff-apply">Применить</button>
            </div>
        </div>
        <div class="file-viewer" id="file-viewer">
            <div class="file-viewer-header">
                <span id="file-viewer-name">—</span>
                <div>
                    <button class="file-viewer-close" id="file-viewer-add-context" title="Добавить в контекст" style="margin-right:4px;font-size:0.8rem;">📎</button>
                    <button class="file-viewer-close" id="file-viewer-close">×</button>
                </div>
            </div>
            <div class="file-viewer-content" id="file-viewer-content"></div>
        </div>
        <div class="content-main">
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="loading" id="loading">Модель думает...</div>
            </div>
            <div class="input-area">
                <div id="command-suggestion" style="display:none;max-width:900px;margin:0 auto 8px;padding:8px;background:var(--bg-suggestion);border:1px solid var(--border-primary);border-radius:8px;font-size:0.82rem;color:var(--text-primary);"></div>
                <div id="terminal-output" style="display:none;max-width:900px;margin:0 auto 8px;padding:12px;background:var(--bg-terminal);color:var(--text-code);border-radius:8px;font-family:'Courier New',monospace;font-size:0.82rem;white-space:pre-wrap;max-height:200px;overflow-y:auto;"></div>
                <form id="chat-form" class="input-form">
                    <select id="model-select" class="model-select">
                        <option value="" style="background:var(--bg-input);color:var(--text-primary);">Выберите модель...</option>
                    </select>
                    <textarea id="message-input" class="message-input" placeholder="Сообщение..." rows="1"></textarea>
                    <button type="submit" id="send-btn" class="send-btn">Отправить</button>
                </form>
                <div class="loading" id="loading"></div>
            </div>
        </div>
    </div>

    <!-- Directory Load Modal -->
    <div id="load-dir-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3 style="margin:0 0 16px 0;color:#333;font-size:1.1rem;">Загрузить директорию в контекст</h3>
            <div style="margin-bottom:12px;">
                <label style="display:block;font-size:0.85rem;margin-bottom:4px;">Путь к директории:</label>
                <input type="text" id="load-dir-path" placeholder="Например: src/models" style="width:100%;padding:8px;border:1px solid var(--border-primary);border-radius:4px;font-size:0.85rem;font-family:monospace;background:var(--bg-input);color:var(--text-primary);">
            </div>
            <div style="margin-bottom:12px;">
                <label style="display:block;font-size:0.85rem;margin-bottom:4px;">Макс. файлов: <span id="max-files-value">50</span></label>
                <input type="range" id="load-dir-max-files" min="5" max="200" value="50" style="width:100%;" oninput="document.getElementById('max-files-value').textContent=this.value">
            </div>
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:0.85rem;margin-bottom:4px;">Макс. размер (МБ): <span id="max-size-value">10</span></label>
                <input type="range" id="load-dir-max-size" min="1" max="50" value="10" style="width:100%;" oninput="document.getElementById('max-size-value').textContent=this.value">
            </div>
            <div id="load-dir-progress" style="display:none;margin-bottom:12px;padding:8px;background:var(--bg-message-system);border-radius:4px;font-size:0.82rem;">
                <div style="margin-bottom:4px;">⏳ Загрузка...</div>
                <div style="background:var(--bg-loader-track);border-radius:4px;height:20px;overflow:hidden;">
                    <div id="load-dir-progress-bar" style="background:var(--bg-progress-bar);height:100%;width:0%;transition:width 0.3s;"></div>
                </div>
                <div id="load-dir-progress-text" style="margin-top:4px;color:var(--text-secondary);"></div>
            </div>
            <div id="load-dir-error" style="display:none;padding:8px;background:var(--bg-error);color:var(--text-diff-removed);border-radius:4px;font-size:0.82rem;margin-bottom:12px;"></div>
            <div id="load-dir-success" style="display:none;padding:8px;background:var(--bg-success);color:var(--text-diff-added);border-radius:4px;font-size:0.82rem;margin-bottom:12px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button id="load-dir-cancel-btn" class="btn-secondary">Отмена</button>
                <button id="load-dir-load-btn" class="btn-apply">Загрузить</button>
            </div>
        </div>
    </div>

    <!-- Create DB Modal -->
    <div id="create-db-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3 style="margin:0 0 16px 0;color:var(--text-primary);font-size:1.1rem;">Создать векторную базу данных</h3>
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:4px;">Имя базы (только буквы, цифры, _ и -):</label>
                <input type="text" id="db-name-input" placeholder="Например: уставные_документы" style="width:100%;padding:8px;border:1px solid var(--border-primary);border-radius:4px;font-size:0.85rem;font-family:monospace;background:var(--bg-input);color:var(--text-primary);">
                <div id="create-db-error" style="display:none;padding:8px;background:var(--bg-error);color:var(--text-diff-removed);border-radius:4px;font-size:0.82rem;margin-top:8px;"></div>
                <div id="create-db-success" style="display:none;padding:8px;background:var(--bg-success);color:var(--text-diff-added);border-radius:4px;font-size:0.82rem;margin-top:8px;"></div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button id="create-db-cancel-btn" class="btn-secondary">Отмена</button>
                <button id="create-db-apply-btn" class="btn-apply">Создать</button>
            </div>
        </div>
    </div>
    <!-- Workspace Selection Modal -->
    <div id="workspace-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3 style="margin:0 0 16px 0;font-size:1.1rem;">Выбрать рабочую папку</h3>
            <div style="margin-bottom:12px;">
                <label style="display:block;font-size:0.85rem;margin-bottom:4px;">Текущая папка:</label>
                <div id="current-workspace-path" style="padding:8px;background:var(--bg-secondary);border-radius:4px;font-size:0.82rem;font-family:monospace;word-break:break-all;max-height:60px;overflow-y:auto;"></div>
            </div>
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:0.85rem;margin-bottom:4px;">Новая папка:</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="workspace-path-input" placeholder="Введите путь к папке или выберите..." style="flex:1;padding:8px;border:1px solid var(--border-primary);border-radius:4px;font-size:0.85rem;font-family:monospace;background:var(--bg-input);color:var(--text-primary);">
                    <input type="file" id="workspace-folder-input" webkitdirectory="" directory="" multiple style="display:none;">
                    <button id="browse-folder-btn" class="btn-secondary" style="padding:8px 16px;border:1px solid var(--border-primary);border-radius:4px;cursor:pointer;font-size:0.85rem;white-space:nowrap;">Обзор</button>
                </div>
            </div>
            <div id="workspace-error" style="display:none;padding:8px;background:var(--bg-error);color:var(--text-diff-removed);border-radius:4px;font-size:0.82rem;margin-bottom:12px;"></div>
            <div id="workspace-success" style="display:none;padding:8px;background:var(--bg-success);color:var(--text-diff-added);border-radius:4px;font-size:0.82rem;margin-bottom:12px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button id="workspace-cancel-btn" class="btn-secondary">Отмена</button>
                <button id="workspace-apply-btn" class="btn-apply">Применить</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const modelSelect = document.getElementById('model-select');
        const sendBtn = document.getElementById('send-btn');
        const loading = document.getElementById('loading');
        const statusEl = document.getElementById('status');
        const usernameEl = document.getElementById('username');
        const logoutBtn = document.getElementById('logout-btn');
        const sessionsPanel = document.getElementById('sessions-panel');
        const sessionsList = document.getElementById('sessions-list');
        const createSessionBtn = document.getElementById('create-session-btn');
        const filePanel = document.getElementById('file-panel');
        const fileTree = document.getElementById('file-tree');
        const searchFilesBtn = document.getElementById('search-files-btn');
        const searchFilesInput = document.getElementById('search-files');
        const toggleFilePanelBtn = document.getElementById('toggle-file-panel');
        const fileViewer = document.getElementById('file-viewer');
        const fileViewerName = document.getElementById('file-viewer-name');
        const fileViewerContent = document.getElementById('file-viewer-content');
        const fileViewerClose = document.getElementById('file-viewer-close');
        const commandSuggestion = document.getElementById('command-suggestion');
        const diffViewer = document.getElementById('diff-viewer');
        const diffViewerName = document.getElementById('diff-viewer-name');
        const diffViewerContent = document.getElementById('diff-viewer-content');
        const diffViewerClose = document.getElementById('diff-viewer-close');
        const diffApplyBtn = document.getElementById('diff-apply');
        const diffRejectBtn = document.getElementById('diff-reject');

        let currentModel = '';
        let conversationHistory = [];
        let currentSessionId = null;
        let isSidebarVisible = true;

        async function checkStatus() {
            try {
                const response = await fetch('/health/');
                const data = await response.json();
                
                console.log('Health check response:', data);
                
                if (data.user) {
                    usernameEl.textContent = data.user;
                    document.querySelector('.logout-btn').style.display = 'block';
                } else {
                    window.location.href = '/login/';
                }
                
                const models = data.models || data.available_models;
                if (models && models.length > 0) {
                    console.log('Models received:', models);
                    modelSelect.innerHTML = '';
                    models.forEach((model, index) => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        if (index === 0) {
                            option.selected = true;
                            currentModel = model;
                        }
                        modelSelect.appendChild(option);
                    });
                    statusEl.textContent = 'LM Studio подключен';
                    statusEl.classList.remove('error');
                } else {
                    statusEl.textContent = 'Нет доступных моделей (model_count: ' + (data.model_count || 0) + ', models: ' + JSON.stringify(models || 'null') + ')';
                    statusEl.classList.add('error');
                    console.error('Models data is empty or missing:', data);
                }
                
                await loadSessions();
                await loadFileTree();
            } catch (error) {
                console.error('checkStatus error:', error);
                statusEl.textContent = 'Ошибка подключения';
                statusEl.classList.add('error');
            }
        }

        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions/');
                const data = await response.json();
                
                sessionsList.innerHTML = '';
                data.sessions.forEach(session => {
                    const sessionDiv = document.createElement('div');
                    sessionDiv.className = 'session-item';
                    if (session.session_id === currentSessionId) {
                        sessionDiv.classList.add('active');
                    }
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'session-title';
                    titleSpan.textContent = session.title || new Date(session.updated_at).toLocaleString('ru-RU');
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-session-btn';
                    deleteBtn.textContent = '×';
                    deleteBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        deleteSession(session.session_id);
                    });
                    
                    sessionDiv.appendChild(titleSpan);
                    sessionDiv.appendChild(deleteBtn);
                    
                    sessionDiv.addEventListener('click', (e) => {
                        if (e.target.closest('.delete-session-btn')) {
                            return;
                        }
                        loadSession(session.session_id);
                    });
                    sessionsList.appendChild(sessionDiv);
                });
                
                if (currentSessionId && !data.sessions.some(s => s.session_id === currentSessionId)) {
                    currentSessionId = null;
                }
            } catch (error) {
                console.error('Ошибка загрузки сессий:', error);
            }
        }

        async function loadSession(sessionId) {
            if (currentSessionId && currentSessionId !== sessionId) {
                await saveCurrentSession();
            }
            
            try {
                const response = await fetch(`/api/sessions/load/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.messages) {
                    currentSessionId = sessionId;
                    conversationHistory = data.messages;
                    chatMessages.innerHTML = '';
                    conversationHistory.forEach(msg => {
                        addMessage(msg.role, msg.content);
                    });
                    loadSessions();
                }
            } catch (error) {
                console.error('Ошибка загрузки сessии:', error);
            }
        }

        async function deleteSession(sessionId) {
            try {
                const response = await fetch('/api/sessions/delete/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                if (response.ok) {
                    if (currentSessionId === sessionId) {
                        currentSessionId = null;
                        conversationHistory = [];
                        chatMessages.innerHTML = '';
                    }
                    loadSessions();
                }
            } catch (error) {
                console.error('Ошибка удаления сессии:', error);
            }
        }

        let currentFilePanelOpen = true;
        let selectedFilesForContext = [];
        let contextBadgeEl = null;

        // Theme management
        const themeToggleBtn = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
            themeToggleBtn.title = theme === 'dark' ? 'Светлая тема' : 'Темная тема';
        }

        function getFileIcon(name) {
            if (name.endsWith('.py')) return '🐍';
            if (name.endsWith('.js') || name.endsWith('.jsx')) return '📜';
            if (name.endsWith('.ts') || name.endsWith('.tsx')) return '📘';
            if (name.endsWith('.html')) return '🌐';
            if (name.endsWith('.css') || name.endsWith('.scss')) return '🎨';
            if (name.endsWith('.json')) return '📋';
            if (name.endsWith('.yaml') || name.endsWith('.yml')) return '⚙️';
            if (name.endsWith('.md')) return '📝';
            if (name.endsWith('.txt')) return '📄';
            if (name.endsWith('.sql')) return '🗃️';
            if (name.endsWith('.env')) return '🔒';
            if (name.endsWith('.sh')) return '⚡';
            if (name.endsWith('.rb')) return '💎';
            if (name.endsWith('.go')) return '🔷';
            if (name.endsWith('.rs')) return '🦀';
            if (name.endsWith('.java')) return '☕';
            if (name.endsWith('.c') || name.endsWith('.h')) return '🔧';
            if (name.endsWith('.cpp') || name.endsWith('.cc')) return '🔧';
            if (name.endsWith('.vue')) return '💚';
            if (name.endsWith('.xml')) return '📰';
            if (name.endsWith('.csv')) return '📊';
            const ext = name.split('.').pop();
            return '📄';
        }

        function renderFileTree(items, depth) {
            if (depth === undefined) depth = 0;
            let html = '';
            for (const item of items) {
                const indent = depth * 16;
                const isDir = item.type === 'dir';
                const hasChildren = isDir && item.children && item.children.length > 0;
                const icon = isDir ? '📁' : getFileIcon(item.name);
                html += '<div class="file-tree-item" data-path="' + item.path + '" data-type="' + item.type + '" style="padding-left:' + indent + 'px">';
                html += '<div class="file-tree-row" data-type="' + item.type + '" onclick="toggleTreeNode(this)">';
                html += '<span class="file-tree-arrow ' + (hasChildren ? '' : 'hidden') + '">' + (hasChildren ? '▼' : '') + '</span>';
                html += '<span class="file-tree-icon">' + icon + '</span>';
                html += '<span>' + item.name + '</span>';
                html += '</div>';
                if (isDir && hasChildren) {
                    html += '<div class="file-tree-children">' + renderFileTree(item.children, depth + 1) + '</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMarkdown(content) {
            let html = content;
            const codeBlocks = [];
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                const placeholder = `__CODEBLOCK_${codeBlocks.length}__`;
                codeBlocks.push({ lang: lang || 'text', code: code.trim() });
                return placeholder;
            });
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/^###\s(.+)/gm, '<h3>$1</h3>');
            html = html.replace(/^##\s(.+)/gm, '<h2>$1</h2>');
            html = html.replace(/^#\s(.+)/gm, '<h1>$1</h1>');
            html = html.replace(/^\-\s(.+)/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/gs, function(match) {
                return '<ul>' + match + '</ul>';
            });
            for (let i = 0; i < codeBlocks.length; i++) {
                const block = codeBlocks[i];
                const codeHtml = escapeHtml(block.code);
                html = html.replace(`__CODEBLOCK_${i}__`,
                    '<div class="code-block">' +
                    '<div class="code-block-header"><span>' + (block.lang === 'text' ? '' : block.lang) + '</span>' +
                    '<button class="code-block-copy" onclick="copyCode(this)">Копировать</button></div>' +
                    '<div class="code-block-content">' + codeHtml + '</div></div>');
            }
            return html;
        }

        async function copyCode(btn) {
            const code = btn.closest('.code-block').querySelector('.code-block-content').textContent;
            await navigator.clipboard.writeText(code);
            btn.textContent = 'Скопировано!';
            setTimeout(() => btn.textContent = 'Копировать', 2000);
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            if (role === 'assistant') {
                messageDiv.innerHTML = renderMarkdown(content);
            } else {
                messageDiv.textContent = content;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentModel) return;

            if (content.startsWith('/')) {
                await handleSlashCommand(content);
                return;
            }

            addMessage('user', content);
            conversationHistory.push({ role: 'user', content: content });
            messageInput.value = '';
            messageInput.style.height = '48px';
            sendBtn.disabled = true;
            loading.classList.add('visible');

            try {
                var body = {
                    model: currentModel,
                    messages: conversationHistory,
                    temperature: 0.7,
                    stream: true
                };
                
                if (currentSessionId) {
                    body.session_id = currentSessionId;
                }
                
                if (selectedFilesForContext.length > 0) {
                    var contextFiles = [];
                    for (var f of selectedFilesForContext) {
                        var resp = await fetch('/api/files/read/?path=' + encodeURIComponent(f));
                        var fileData = await resp.json();
                        if (!fileData.error) {
                            contextFiles.push({ path: f, content: fileData.content });
                        }
                    }
                    if (contextFiles.length > 0) {
                        body.context_files = contextFiles;
                    }
                }
                
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let assistantContent = '';
                let sessionReturned = false;
                addMessage('assistant', '');
                const assistantMsgEl = chatMessages.querySelector('.message.assistant:last-of-type');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value, { stream: true });
                    const lines = text.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6);
                            if (jsonStr === '[DONE]') continue;
                            try {
                                const chunk = JSON.parse(jsonStr);
                                if (chunk.content) {
                                    assistantContent += chunk.content;
                                    if (assistantMsgEl) {
                                        assistantMsgEl.innerHTML = renderMarkdown(assistantContent);
                                        chatMessages.scrollTop = chatMessages.scrollHeight;
                                    }
                                }
                                if (chunk.session_id) {
                                    sessionReturned = true;
                                }
                                if (chunk.error) {
                                    addMessage('system', 'Ошибка: ' + chunk.error);
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                if (assistantContent) {
                    conversationHistory.push({ role: 'assistant', content: assistantContent });
                    
                    if (sessionReturned && !currentSessionId) {
                        currentSessionId = body.session_id;
                        await loadSessions();
                    } else if (sessionReturned && currentSessionId) {
                        await saveCurrentSession();
                    }
                }
            } catch (error) {
                addMessage('system', 'Ошибка сети: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                loading.classList.remove('visible');
                messageInput.focus();
            }
        }

        async function handleSlashCommand(text) {
            const parts = text.split(' ', 2);
            const cmd = parts[0].toLowerCase();
            const arg = parts[1] || '';
            
            if (cmd === '/fix') {
                const msg = currentSelectedFilePath
                    ? `Исправь ошибки в файле: ${currentSelectedFilePath}\n\n${arg}`
                    : `Исправь ошибки в выделенном коде:\n\n${arg || 'Нужно проанализировать и исправить ошибки в текущем проекте.'}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/explain') {
                const msg = currentSelectedFilePath
                    ? `Объясни подробно что делает файл: ${currentSelectedFilePath}\n\n${arg}`
                    : `Объясни что делает этот код:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/test') {
                const msg = currentSelectedFilePath
                    ? `Напиши unit-тесты для файла: ${currentSelectedFilePath}\n\n${arg}`
                    : `Напиши тесты для этого кода:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/docs') {
                const msg = currentSelectedFilePath
                    ? `Добавь docstring и документацию для файла: ${currentSelectedFilePath}\n\n${arg}`
                    : `Добавь документацию к этому коду:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/refactor') {
                const msg = currentSelectedFilePath
                    ? `Рефактори файл: ${currentSelectedFilePath} — улучши читаемость и производительность\n\n${arg}`
                    : `Рефактори этот код:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/inspector') {
                messageInput.value = text;
                sendMessage();
            } else if (cmd === '/run') {
                runTerminalCommand(arg);
            } else if (cmd === '/docx') {
                downloadDocx(arg);
            } else if (cmd === '/apply') {
                applySelectedFile(arg);
            } else {
                messageInput.value = text;
                sendMessage();
            }
        }

        async function applySelectedFile(arg) {
            const filepath = arg || currentSelectedFilePath;
            if (!filepath) {
                addMessage('system', 'Укажите файл: /apply path/to/file.py');
                return;
            }
            addMessage('system', 'Генерация изменений для ' + filepath + '...');
            try {
                const response = await fetch('/api/files/read/?path=' + encodeURIComponent(filepath));
                const data = await response.json();
                if (data.error) {
                    addMessage('system', 'Файл не найден: ' + filepath);
                    return;
                }
                const oldContent = data.content;
                conversationHistory.push({
                    role: 'user',
                    content: 'Пожалуйста, предоставь изменённую версию файла ' + filepath + '. Верни только новый содержимое файла в блоке кода. Не включай никаких объяснений.'
                });
                
                const resp = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: currentModel,
                        messages: conversationHistory,
                        temperature: 0.2,
                        stream: false,
                        session_id: currentSessionId
                    })
                });
                const chatData = await resp.json();
                if (chatData.error) {
                    addMessage('system', 'Ошибка: ' + chatData.error);
                    return;
                }
                
                conversationHistory.push({ role: 'assistant', content: chatData.content });
                
                // Extract code block
                const codeMatch = chatData.content.match(/```(?:\w+)?\n([\s\S]*?)```/);
                if (codeMatch) {
                    const newContent = codeMatch[1];
                    addMessage('system', '✅ Изменения готовы для ' + filepath + '. Проверьте diff ниже.');
                    await showDiff(oldContent, newContent, filepath);
                } else {
                    addMessage('system', 'Не удалось извлечь код из ответа. Ответ был: ' + chatData.content.substring(0, 200));
                }
            } catch (error) {
                addMessage('system', 'Ошибка: ' + error.message);
            }
        }

        async function runTerminalCommand(command) {
            const outputEl = document.getElementById('terminal-output');
            outputEl.style.display = 'block';
            outputEl.textContent = '$ ' + command + '\n\n';
            sendBtn.disabled = true;
            try {
                const response = await fetch('/api/command/run/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: command })
                });
                const data = await response.json();
                if (data.output) outputEl.textContent += data.output;
                if (data.error) outputEl.textContent += (data.output ? '\n' : '') + '❌ ' + data.error;
                if (data.returncode !== undefined && data.returncode !== 0) {
                    outputEl.textContent += '\n\nProcess exited with code ' + data.returncode;
                }
            } catch (error) {
                outputEl.textContent += '❌ Network error: ' + error.message;
            } finally {
                sendBtn.disabled = false;
            }
        }

            form.appendChild(contentInput);

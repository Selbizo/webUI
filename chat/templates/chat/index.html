<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Web UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #3d3d3d;
            padding: 16px 24px;
            border-bottom: 1px solid #cccccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.2rem;
            color: #333;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .username {
            font-size: 0.9rem;
            color: #666;
        }
        .status {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 12px;
            background: #22c55e;
            color: #fff;
        }
        .status.error {
            background: #ef4444;
        }
        .logout-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #6b6b6b;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #525252;
        }
        .chat-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }
        .message.user {
            align-self: flex-end;
            background: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center;
            background: #f0f0f0;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .message.assistant code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }
        .message.assistant pre {
            background: #3d3d3d;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message.assistant pre code {
            background: transparent;
            padding: 0;
            color: #eee;
        }
        .message.assistant h1, .message.assistant h2, .message.assistant h3 {
            margin: 12px 0 8px 0;
            color: #333;
        }
        .message.assistant strong {
            color: #333;
        }
        .message.assistant em {
            color: #666;
        }
        .message.assistant li {
            margin: 4px 0;
            list-style-type: disc;
        }
        .input-area {
            background: #e8e8e8;
            padding: 24px;
            border-top: 1px solid #cccccc;
            flex-shrink: 0;
        }
        .input-form {
            display: flex;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }
        .model-select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            background: #ffffff;
            color: #333;
            font-size: 0.9rem;
            min-width: 200px;
        }
        .message-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            background: #ffffff;
            color: #333;
            font-size: 1rem;
            resize: none;
            min-height: 48px;
            max-height: 200px;
        }
        .message-input:focus {
            outline: none;
            border-color: #6b6b6b;
        }
        .send-btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: #6b6b6b;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #525252;
        }
        .send-btn:disabled {
            background: #a0a0a0;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            padding: 8px 16px;
            border-radius: 8px;
            background: #cccccc;
            color: #666;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .loading.visible {
            display: block;
        }
        .sessions-panel {
            width: 250px;
            background: #e8e8e8;
            border-right: 1px solid #cccccc;
            padding: 16px;
            overflow-y: auto;
        }
        .sessions-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }
        .session-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
        }
        .session-item .session-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .session-item .delete-session-btn {
            flex-shrink: 0;
            margin-left: 8px;
            padding: 2px 6px;
            border: none;
            background: #ef4444;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .session-item:hover {
            background: #f5f5f5;
        }
        .session-item.active {
            background: #d4d4d4;
            border-color: #999999;
        }
        .create-session-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: none;
            background: #808080;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .create-session-btn:hover {
            background: #666666;
        }
        .delete-session-btn:hover {
            background: #dc2626;
        }
        .file-panel {
            width: 220px;
            background: #e8e8e8;
            border-right: 1px solid #cccccc;
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .file-panel.visible {
            display: block;
        }
        .file-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .file-panel-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #333;
        }
        .file-tree {
            font-size: 0.82rem;
        }
        .file-tree-item {
            user-select: none;
        }
        .file-tree-row {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            gap: 4px;
        }
        .file-tree-row:hover {
            background: #f5f5f5;
        }
        .file-tree-row.open {
            background: #f0f0f0;
        }
        .file-tree-row.file {
            padding-left: 20px;
        }
        .file-tree-row.file:hover {
            color: #6b6b6b;
        }
        .file-tree-row.active {
            background: #d4d4d4;
            color: #333;
        }
        .file-tree-arrow {
            width: 16px;
            text-align: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            color: #999;
        }
        .file-tree-arrow.hidden {
            visibility: hidden;
        }
        .file-tree-icon {
            margin-right: 4px;
            font-size: 0.85rem;
        }
        .file-tree-children {
            display: none;
        }
        .file-tree-children.open {
            display: block;
        }
        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .content-main {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }
        .file-viewer {
            display: none;
            flex-direction: column;
            width: 400px;
            border-right: 1px solid #cccccc;
            background: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }
        .file-viewer.visible {
            display: flex;
        }
        .file-viewer-header {
            padding: 8px 12px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: bold;
            color: #333;
        }
        .file-viewer-close {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #999;
            padding: 0 4px;
        }
        .file-viewer-close:hover {
            color: #333;
        }
        .file-viewer-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            background: #fafafa;
        }
        .file-viewer-line {
            display: flex;
            white-space: pre;
        }
        .file-viewer-line:hover {
            background: #f0f0f0;
        }
        .line-number {
            display: inline-block;
            width: 40px;
            text-align: right;
            padding-right: 12px;
            color: #999;
            user-select: none;
            border-right: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .line-content {
            padding-left: 12px;
            color: #333;
        }
        .file-viewer-content code {
            background: #3d3d3d;
            color: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
        }
        .file-viewer-content pre {
            background: #3d3d3d;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            color: #eee;
        }
        .code-block {
            display: flex;
            flex-direction: column;
            margin: 8px 0;
            background: #3d3d3d;
            border-radius: 8px;
            overflow: hidden;
        }
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #2d2d2d;
            color: #aaa;
            font-size: 0.75rem;
        }
        .code-block-copy {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .code-block-copy:hover {
            background: #444;
        }
        .code-block-content {
            display: flex;
            flex-direction: column;
        }
        .diff-viewer {
            display: none;
            flex-direction: column;
            width: 450px;
            border-right: 1px solid #cccccc;
            background: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }
        .diff-viewer.visible {
            display: flex;
        }
        .diff-viewer-header {
            padding: 8px 12px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: bold;
            color: #333;
        }
        .diff-viewer-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            background: #fafafa;
        }
        .diff-line {
            display: flex;
            white-space: pre;
            padding: 0 8px;
        }
        .diff-line:hover {
            background: #f0f0f0;
        }
        .diff-line.added {
            background: #e6ffec;
        }
        .diff-line.added .diff-number { background: #d4ffd4; }
        .diff-line.removed {
            background: #ffebe9;
        }
        .diff-line.removed .diff-number { background: #ffd4d4; }
        .diff-line.hunk {
            background: #f0f0f0;
            color: #666;
        }
        .diff-line.header {
            background: #f0f0f0;
            color: #999;
        }
        .diff-number {
            display: inline-block;
            width: 35px;
            text-align: right;
            padding-right: 8px;
            color: #999;
            user-select: none;
            border-right: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .diff-content {
            padding-left: 8px;
        }
        .diff-content.added-text { color: #1a7f37; }
        .diff-content.removed-text { color: #cf222e; }
        .diff-actions {
            padding: 8px 12px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            background: #f5f5f5;
        }
        .btn-apply {
            padding: 4px 12px;
            border-radius: 4px;
            border: none;
            background: #22c55e;
            color: #fff;
            cursor: pointer;
            font-size: 0.82rem;
        }
        .btn-apply:hover {
            background: #16a34a;
        }
        .btn-reject {
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-size: 0.82rem;
        }
        .btn-reject:hover {
            background: #eee;
        }
        .code-block-header {
            padding: 12px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            color: #eee;
            white-space: pre;
        }
        .search-files {
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.82rem;
            margin-bottom: 8px;
            background: #fff;
            color: #333;
            display: none;
        }
        .search-files.visible {
            display: block;
        }
        .sidebar-toggle {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: #6b6b6b;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .sidebar-toggle:hover {
            background: #525252;
        }
        .btn-secondary {
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            color: #333;
        }
        .btn-secondary:hover {
            background: #f5f5f5;
        }
        .btn-apply {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #10b981;
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-apply:hover {
            background: #059669;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-content {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            min-width: 450px;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LM Studio Web UI</h1>
        <div class="user-info">
            <span class="username" id="username">Гость</span>
            <span id="status" class="status">Загрузка...</span>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </div>
    </div>
    <div class="content-wrapper">
        <div class="sessions-panel" id="sessions-panel">
            <div class="sessions-title">Сессии</div>
            <button id="create-session-btn" class="create-session-btn">Новая сессия</button>
            <div id="sessions-list"></div>
        </div>
        <div class="file-panel" id="file-panel">
            <div class="file-panel-header">
                <span class="file-panel-title">Файлы</span>
                <div>
                    <button id="set-workspace-btn" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;" title="Выбрать папку">📂</button>
                    <button id="load-dir-btn" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;" title="Загрузить директорию в контекст">📚</button>
                    <button id="search-files-btn" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;" title="Поиск">🔍</button>
                    <button id="toggle-file-panel" class="sidebar-toggle" style="font-size:0.8rem;padding:2px 6px;margin-left:2px;" title="Закрыть">✕</button>
                </div>
            </div>
            <div id="workspace-info" style="font-size:0.75rem;color:#666;padding:4px 0;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title=""></div>
            <input type="text" class="search-files" id="search-files" placeholder="Поиск файлов...">
            <div class="file-tree" id="file-tree"></div>
        </div>
        <div class="diff-viewer" id="diff-viewer">
            <div class="diff-viewer-header">
                <span id="diff-viewer-name">—</span>
                <button class="file-viewer-close" id="diff-viewer-close">×</button>
            </div>
            <div class="diff-viewer-content" id="diff-viewer-content"></div>
            <div class="diff-actions">
                <button class="btn-reject" id="diff-reject">Отклонить</button>
                <button class="btn-apply" id="diff-apply">Применить</button>
            </div>
        </div>
        <div class="file-viewer" id="file-viewer">
            <div class="file-viewer-header">
                <span id="file-viewer-name">—</span>
                <div>
                    <button class="file-viewer-close" id="file-viewer-add-context" title="Добавить в контекст" style="margin-right:4px;font-size:0.8rem;">📎</button>
                    <button class="file-viewer-close" id="file-viewer-close">×</button>
                </div>
            </div>
            <div class="file-viewer-content" id="file-viewer-content"></div>
        </div>
        <div class="content-main">
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="loading" id="loading">Модель думает...</div>
            </div>
            <div class="input-area">
                <div id="command-suggestion" style="display:none;max-width:900px;margin:0 auto 8px;padding:8px;background:#fff;border:1px solid #ccc;border-radius:8px;font-size:0.82rem;"></div>
                <div id="terminal-output" style="display:none;max-width:900px;margin:0 auto 8px;padding:12px;background:#1e1e1e;color:#eee;border-radius:8px;font-family:'Courier New',monospace;font-size:0.82rem;white-space:pre-wrap;max-height:200px;overflow-y:auto;"></div>
                <form id="chat-form" class="input-form">
                    <select id="model-select" class="model-select">
                        <option value="">Выберите модель...</option>
                    </select>
                    <textarea id="message-input" class="message-input" placeholder="Сообщение..." rows="1"></textarea>
                    <button type="submit" id="send-btn" class="send-btn">Отправить</button>
                </form>
                <div class="loading" id="loading"></div>
            </div>
        </div>
    </div>

    <!-- Directory Load Modal -->
    <div id="load-dir-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3 style="margin:0 0 16px 0;color:#333;font-size:1.1rem;">Загрузить директорию в контекст</h3>
            <div style="margin-bottom:12px;">
                <label style="display:block;font-size:0.85rem;color:#555;margin-bottom:4px;">Путь к директории:</label>
                <input type="text" id="load-dir-path" placeholder="Например: src/models" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:0.85rem;font-family:monospace;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="display:block;font-size:0.85rem;color:#555;margin-bottom:4px;">Макс. файлов: <span id="max-files-value">50</span></label>
                <input type="range" id="load-dir-max-files" min="5" max="200" value="50" style="width:100%;" oninput="document.getElementById('max-files-value').textContent=this.value">
            </div>
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:0.85rem;color:#555;margin-bottom:4px;">Макс. размер (МБ): <span id="max-size-value">10</span></label>
                <input type="range" id="load-dir-max-size" min="1" max="50" value="10" style="width:100%;" oninput="document.getElementById('max-size-value').textContent=this.value">
            </div>
            <div id="load-dir-progress" style="display:none;margin-bottom:12px;padding:8px;background:#f0f0f0;border-radius:4px;font-size:0.82rem;">
                <div style="margin-bottom:4px;">⏳ Загрузка...</div>
                <div style="background:#e0e0e0;border-radius:4px;height:20px;overflow:hidden;">
                    <div id="load-dir-progress-bar" style="background:#22c55e;height:100%;width:0%;transition:width 0.3s;"></div>
                </div>
                <div id="load-dir-progress-text" style="margin-top:4px;color:#666;"></div>
            </div>
            <div id="load-dir-error" style="display:none;padding:8px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:0.82rem;margin-bottom:12px;"></div>
            <div id="load-dir-success" style="display:none;padding:8px;background:#d1fae5;color:#059669;border-radius:4px;font-size:0.82rem;margin-bottom:12px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button id="load-dir-cancel-btn" class="btn-secondary">Отмена</button>
                <button id="load-dir-load-btn" class="btn-apply">Загрузить</button>
            </div>
        </div>
    </div>

    <!-- Workspace Selection Modal -->
    <div id="workspace-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const modelSelect = document.getElementById('model-select');
        const sendBtn = document.getElementById('send-btn');
        const loading = document.getElementById('loading');
        const statusEl = document.getElementById('status');
        const usernameEl = document.getElementById('username');
        const logoutBtn = document.getElementById('logout-btn');
        const sessionsPanel = document.getElementById('sessions-panel');
        const sessionsList = document.getElementById('sessions-list');
        const createSessionBtn = document.getElementById('create-session-btn');
        const filePanel = document.getElementById('file-panel');
        const fileTree = document.getElementById('file-tree');
        const searchFilesBtn = document.getElementById('search-files-btn');
        const searchFilesInput = document.getElementById('search-files');
        const toggleFilePanelBtn = document.getElementById('toggle-file-panel');
        const fileViewer = document.getElementById('file-viewer');
        const fileViewerName = document.getElementById('file-viewer-name');
        const fileViewerContent = document.getElementById('file-viewer-content');
        const fileViewerClose = document.getElementById('file-viewer-close');
        const commandSuggestion = document.getElementById('command-suggestion');
        const diffViewer = document.getElementById('diff-viewer');
        const diffViewerName = document.getElementById('diff-viewer-name');
        const diffViewerContent = document.getElementById('diff-viewer-content');
        const diffViewerClose = document.getElementById('diff-viewer-close');
        const diffApplyBtn = document.getElementById('diff-apply');
        const diffRejectBtn = document.getElementById('diff-reject');

        let currentModel = '';
        let conversationHistory = [];
        let currentSessionId = null;
        let isSidebarVisible = true;

        async function checkStatus() {
            try {
                const response = await fetch('/health/');
                const data = await response.json();
                
                console.log('Health check response:', data);
                
                if (data.user) {
                    usernameEl.textContent = data.user;
                    document.querySelector('.logout-btn').style.display = 'block';
                } else {
                    window.location.href = '/login/';
                }
                
                const models = data.models || data.available_models;
                if (models && models.length > 0) {
                    console.log('Models received:', models);
                    modelSelect.innerHTML = '';
                    models.forEach((model, index) => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        if (index === 0) {
                            option.selected = true;
                            currentModel = model;
                        }
                        modelSelect.appendChild(option);
                    });
                    statusEl.textContent = 'LM Studio подключен';
                    statusEl.classList.remove('error');
                } else {
                    statusEl.textContent = 'Нет доступных моделей (model_count: ' + (data.model_count || 0) + ', models: ' + JSON.stringify(models || 'null') + ')';
                    statusEl.classList.add('error');
                    console.error('Models data is empty or missing:', data);
                }
                
                await loadSessions();
                await loadFileTree();
            } catch (error) {
                console.error('checkStatus error:', error);
                statusEl.textContent = 'Ошибка подключения';
                statusEl.classList.add('error');
            }
        }

        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions/');
                const data = await response.json();
                
                sessionsList.innerHTML = '';
                data.sessions.forEach(session => {
                    const sessionDiv = document.createElement('div');
                    sessionDiv.className = 'session-item';
                    if (session.session_id === currentSessionId) {
                        sessionDiv.classList.add('active');
                    }
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'session-title';
                    titleSpan.textContent = session.title || new Date(session.updated_at).toLocaleString('ru-RU');
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-session-btn';
                    deleteBtn.textContent = '×';
                    deleteBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        deleteSession(session.session_id);
                    });
                    
                    sessionDiv.appendChild(titleSpan);
                    sessionDiv.appendChild(deleteBtn);
                    
                    sessionDiv.addEventListener('click', (e) => {
                        if (e.target.closest('.delete-session-btn')) {
                            return;
                        }
                        loadSession(session.session_id);
                    });
                    sessionsList.appendChild(sessionDiv);
                });
                
                if (currentSessionId && !data.sessions.some(s => s.session_id === currentSessionId)) {
                    currentSessionId = null;
                }
            } catch (error) {
                console.error('Ошибка загрузки сессий:', error);
            }
        }

        async function loadSession(sessionId) {
            if (currentSessionId && currentSessionId !== sessionId) {
                await saveCurrentSession();
            }
            
            try {
                const response = await fetch(`/api/sessions/load/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.messages) {
                    currentSessionId = sessionId;
                    conversationHistory = data.messages;
                    chatMessages.innerHTML = '';
                    conversationHistory.forEach(msg => {
                        addMessage(msg.role, msg.content);
                    });
                    loadSessions();
                }
            } catch (error) {
                console.error('Ошибка загрузки сessии:', error);
            }
        }

        async function deleteSession(sessionId) {
            try {
                const response = await fetch('/api/sessions/delete/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                if (response.ok) {
                    if (currentSessionId === sessionId) {
                        currentSessionId = null;
                        conversationHistory = [];
                        chatMessages.innerHTML = '';
                    }
                    loadSessions();
                }
            } catch (error) {
                console.error('Ошибка удаления сессии:', error);
            }
        }

        let currentFilePanelOpen = true;
        let selectedFilesForContext = [];
        let contextBadgeEl = null;

        function getFileIcon(name) {
            if (name.endsWith('.py')) return '🐍';
            if (name.endsWith('.js') || name.endsWith('.jsx')) return '📜';
            if (name.endsWith('.ts') || name.endsWith('.tsx')) return '📘';
            if (name.endsWith('.html')) return '🌐';
            if (name.endsWith('.css') || name.endsWith('.scss')) return '🎨';
            if (name.endsWith('.json')) return '📋';
            if (name.endsWith('.yaml') || name.endsWith('.yml')) return '⚙️';
            if (name.endsWith('.md')) return '📝';
            if (name.endsWith('.txt')) return '📄';
            if (name.endsWith('.sql')) return '🗃️';
            if (name.endsWith('.env')) return '🔒';
            if (name.endsWith('.sh')) return '⚡';
            if (name.endsWith('.rb')) return '💎';
            if (name.endsWith('.go')) return '🔷';
            if (name.endsWith('.rs')) return '🦀';
            if (name.endsWith('.java')) return '☕';
            if (name.endsWith('.c') || name.endsWith('.h')) return '🔧';
            if (name.endsWith('.cpp') || name.endsWith('.cc')) return '🔧';
            if (name.endsWith('.vue')) return '💚';
            if (name.endsWith('.xml')) return '📰';
            if (name.endsWith('.csv')) return '📊';
            const ext = name.split('.').pop();
            return '📄';
        }

        function renderFileTree(items, depth) {
            if (depth === undefined) depth = 0;
            let html = '';
            for (const item of items) {
                const indent = depth * 16;
                const isDir = item.type === 'dir';
                const hasChildren = isDir && item.children && item.children.length > 0;
                const icon = isDir ? '📁' : getFileIcon(item.name);
                html += '<div class="file-tree-item" data-path="' + item.path + '" data-type="' + item.type + '" style="padding-left:' + indent + 'px">';
                html += '<div class="file-tree-row" data-type="' + item.type + '" onclick="toggleTreeNode(this)">';
                html += '<span class="file-tree-arrow ' + (hasChildren ? '' : 'hidden') + '">' + (hasChildren ? '▼' : '') + '</span>';
                html += '<span class="file-tree-icon">' + icon + '</span>';
                html += '<span>' + item.name + '</span>';
                html += '</div>';
                if (isDir && hasChildren) {
                    html += '<div class="file-tree-children">' + renderFileTree(item.children, depth + 1) + '</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function toggleTreeNode(row) {
            var item = row.closest('.file-tree-item');
            var children = item.querySelector('.file-tree-children');
            var arrow = row.querySelector('.file-tree-arrow');
            
            if (children) {
                var isOpen = children.classList.contains('open');
                children.classList.toggle('open');
                row.classList.toggle('open');
                arrow.textContent = isOpen ? '▶' : '▼';
            } else {
                var filePath = item.dataset.path;
                openFileInViewer(filePath);
                document.querySelectorAll('.file-tree-row.active').forEach(function(r) { r.classList.remove('active'); });
                row.classList.add('active');
            }
        }

        async function loadFileTree() {
            try {
                var response = await fetch('/api/files/list/');
                var data = await response.json();
                if (data.files) {
                    fileTree.innerHTML = renderFileTree(data.files);
                }
            } catch (error) {
                console.error('Ошибка загрузки файлов:', error);
            }
        }
        
        async function initWorkspaceInfo() {
            try {
                const response = await fetch('/api/workspace/get/');
                const data = await response.json();
                const workspaceInfo = document.getElementById('workspace-info');
                if (workspaceInfo && data.path) {
                    workspaceInfo.textContent = '📁 ' + data.path;
                    workspaceInfo.title = data.path;
                }
            } catch (error) {
                console.error('Ошибка загрузки workspace:', error);
            }
        }

        async function openFileInViewer(filePath) {
            try {
                var response = await fetch('/api/files/read/?path=' + encodeURIComponent(filePath));
                var data = await response.json();
                if (data.error) {
                    addMessage('system', 'Ошибка чтения файла: ' + data.error);
                    return;
                }
                fileViewerName.textContent = filePath;
                fileViewerContent.innerHTML = '';
                
                var lines = data.content.split('\n');
                for (var i = 0; i < lines.length; i++) {
                    var lineDiv = document.createElement('div');
                    lineDiv.className = 'file-viewer-line';
                    var spanNum = document.createElement('span');
                    spanNum.className = 'line-number';
                    spanNum.textContent = (i + 1);
                    var spanContent = document.createElement('span');
                    spanContent.className = 'line-content';
                    spanContent.textContent = lines[i];
                    lineDiv.appendChild(spanNum);
                    lineDiv.appendChild(spanContent);
                    fileViewerContent.appendChild(lineDiv);
                }
                
                fileViewer.classList.add('visible');
                fileViewerContent.scrollTop = 0;
                currentFilePathInViewer = filePath;
                currentFileContentInViewer = data.content;
                updateContextBadge();
            } catch (error) {
                console.error('Ошибка чтения файла:', error);
            }
        }

        var currentFilePathInViewer = null;
        var currentFileContentInViewer = null;
        var currentDiffData = null;
        var currentDiffFilePath = null;

        function addFileToContext() {
            if (currentFilePathInViewer && !selectedFilesForContext.includes(currentFilePathInViewer)) {
                selectedFilesForContext.push(currentFilePathInViewer);
                updateContextBadge();
                fileViewerName.textContent = currentFilePathInViewer + ' ✓';
            }
        }

        function removeFileFromContext(filePath) {
            selectedFilesForContext = selectedFilesForContext.filter(f => f !== filePath);
            updateContextBadge();
            if (currentFilePathInViewer === filePath) {
                fileViewerName.textContent = filePath;
            }
        }

        function updateContextBadge() {
            if (selectedFilesForContext.length > 0) {
                if (!contextBadgeEl) {
                    contextBadgeEl = document.createElement('div');
                    contextBadgeEl.style.cssText = 'padding:4px 12px;font-size:0.75rem;color:#666;max-width:900px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;';
                    document.querySelector('.input-area').insertBefore(contextBadgeEl, document.querySelector('.input-form'));
                }
                var lastFiles = selectedFilesForContext.slice(-5).map(function(f) { return f.split('/').pop(); });
                var moreText = selectedFilesForContext.length > 5 ? ' + ' + (selectedFilesForContext.length - 5) + ' больше' : '';
                contextBadgeEl.innerHTML = '<span>📎 Контекст: ' + lastFiles.join(', ') + moreText + '</span>' +
                    '<div style="display:flex;gap:8px;">' +
                    '<a href="#" onclick="clearContextFiles();return false;" style="color:#e74c3c;text-decoration:none;">Очистить</a>' +
                    '<a href="#" onclick="clearDirContext();return false;" style="color:#f59e0b;text-decoration:none;" title="Удалить только файлы из директорий">✕ Директории</a>' +
                    '</div>';
            } else if (contextBadgeEl) {
                contextBadgeEl.remove();
                contextBadgeEl = null;
            }
        }

        function clearDirContext() {
            var remaining = [];
            for (var f of selectedFilesForContext) {
                var isInDir = false;
                for (var d of loadedDirPaths) {
                    if (f.startsWith(d + '/') || f === d) {
                        isInDir = true;
                        break;
                    }
                }
                if (!isInDir) {
                    remaining.push(f);
                }
            }
            selectedFilesForContext = remaining;
            updateContextBadge();
        }

        async function showDiff(oldContent, newContent, filepath) {
            currentDiffData = { old: oldContent, new: newContent };
            currentDiffFilePath = filepath;
            
            diffViewerName.textContent = filepath + ' (diff)';
            diffViewerContent.innerHTML = '';
            
            const response = await fetch('/api/diff/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    old_content: oldContent,
                    new_content: newContent,
                    filename: filepath
                })
            });
            const data = await response.json();
            if (data.colorized) {
                for (const dl of data.colorized) {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'diff-line ' + dl.type;
                    const numSpan = document.createElement('span');
                    numSpan.className = 'diff-number';
                    numSpan.textContent = dl.type === 'context' ? '' : (dl.type === 'added' ? '+' : (dl.type === 'removed' ? '-' : ''));
                    const contentSpan = document.createElement('span');
                    contentSpan.className = 'diff-content';
                    if (dl.type === 'added') contentSpan.classList.add('added-text');
                    if (dl.type === 'removed') contentSpan.classList.add('removed-text');
                    contentSpan.textContent = dl.text;
                    lineDiv.appendChild(numSpan);
                    lineDiv.appendChild(contentSpan);
                    diffViewerContent.appendChild(lineDiv);
                }
            }
            
            diffViewer.classList.add('visible');
            diffViewerContent.scrollTop = 0;
        }

        async function applyCurrentDiff() {
            if (!currentDiffData || !currentDiffFilePath) return;
            try {
                const response = await fetch('/api/patch/apply/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        path: currentDiffFilePath,
                        content: currentDiffData.new
                    })
                });
                const data = await response.json();
                if (data.success) {
                    addMessage('system', '✅ Патч применён: ' + currentDiffFilePath);
                    diffViewer.classList.remove('visible');
                    currentDiffData = null;
                    currentDiffFilePath = null;
                    if (currentFilePathInViewer === currentDiffFilePath) {
                        openFileInViewer(currentFilePathInViewer);
                    }
                }
            } catch (error) {
                addMessage('system', 'Ошибка применения патча: ' + error.message);
            }
        }

        function clearContextFiles() {
            selectedFilesForContext = [];
            updateContextBadge();
            if (currentFilePathInViewer) {
                fileViewerName.textContent = currentFilePathInViewer;
            }
        }

        function toggleFilePanel() {
            currentFilePanelOpen = !currentFilePanelOpen;
            filePanel.classList.toggle('visible', currentFilePanelOpen);
        }

        function toggleSearchFiles() {
            searchFilesInput.classList.toggle('visible');
            if (searchFilesInput.classList.contains('visible')) {
                searchFilesInput.focus();
            } else {
                searchFilesInput.value = '';
                filterFileTree('');

        function filterFileTree(query) {
            var rows = fileTree.querySelectorAll('.file-tree-row');
            var q = query.toLowerCase();
            rows.forEach(function(row) {
                var name = row.textContent.toLowerCase();
                var item = row.closest('.file-tree-item');
                if (q && name.includes(q)) {
                    item.style.display = '';
                    var children = item.querySelector('.file-tree-children');
                    if (children) {
                        children.classList.add('open');
                        row.classList.add('open');
                        row.querySelector('.file-tree-arrow').textContent = '▼';
                    }
                } else if (q) {
                    item.style.display = 'none';
                } else {
                    item.style.display = '';
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMarkdown(content) {
            let html = content;
            const codeBlocks = [];
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                const placeholder = `__CODEBLOCK_${codeBlocks.length}__`;
                codeBlocks.push({ lang: lang || 'text', code: code.trim() });
                return placeholder;
            });
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/^###\s(.+)/gm, '<h3>$1</h3>');
            html = html.replace(/^##\s(.+)/gm, '<h2>$1</h2>');
            html = html.replace(/^#\s(.+)/gm, '<h1>$1</h1>');
            html = html.replace(/^\-\s(.+)/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/gs, function(match) {
                return '<ul>' + match + '</ul>';
            });
            for (let i = 0; i < codeBlocks.length; i++) {
                const block = codeBlocks[i];
                const codeHtml = escapeHtml(block.code);
                html = html.replace(`__CODEBLOCK_${i}__`,
                    '<div class="code-block">' +
                    '<div class="code-block-header"><span>' + (block.lang === 'text' ? '' : block.lang) + '</span>' +
                    '<button class="code-block-copy" onclick="copyCode(this)">Копировать</button></div>' +
                    '<div class="code-block-content">' + codeHtml + '</div></div>');
            }
            return html;
        }

        async function copyCode(btn) {
            const code = btn.closest('.code-block').querySelector('.code-block-content').textContent;
            await navigator.clipboard.writeText(code);
            btn.textContent = 'Скопировано!';
            setTimeout(() => btn.textContent = 'Копировать', 2000);
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            if (role === 'assistant') {
                messageDiv.innerHTML = renderMarkdown(content);
            } else {
                messageDiv.textContent = content;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentModel) return;

            if (content.startsWith('/')) {
                await handleSlashCommand(content);
                return;
            }

            addMessage('user', content);
            conversationHistory.push({ role: 'user', content: content });
            messageInput.value = '';
            messageInput.style.height = '48px';
            sendBtn.disabled = true;
            loading.classList.add('visible');

            try {
                var body = {
                    model: currentModel,
                    messages: conversationHistory,
                    temperature: 0.7,
                    stream: true
                };
                
                if (currentSessionId) {
                    body.session_id = currentSessionId;
                }
                
                if (selectedFilesForContext.length > 0) {
                    var contextFiles = [];
                    for (var f of selectedFilesForContext) {
                        var resp = await fetch('/api/files/read/?path=' + encodeURIComponent(f));
                        var fileData = await resp.json();
                        if (!fileData.error) {
                            contextFiles.push({ path: f, content: fileData.content });
                        }
                    }
                    if (contextFiles.length > 0) {
                        body.context_files = contextFiles;
                    }
                }
                
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let assistantContent = '';
                let sessionReturned = false;
                addMessage('assistant', '');
                const assistantMsgEl = chatMessages.querySelector('.message.assistant:last-of-type');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value, { stream: true });
                    const lines = text.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6);
                            if (jsonStr === '[DONE]') continue;
                            try {
                                const chunk = JSON.parse(jsonStr);
                                if (chunk.content) {
                                    assistantContent += chunk.content;
                                    if (assistantMsgEl) {
                                        assistantMsgEl.innerHTML = renderMarkdown(assistantContent);
                                        chatMessages.scrollTop = chatMessages.scrollHeight;
                                    }
                                }
                                if (chunk.session_id) {
                                    sessionReturned = true;
                                }
                                if (chunk.error) {
                                    addMessage('system', 'Ошибка: ' + chunk.error);
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                if (assistantContent) {
                    conversationHistory.push({ role: 'assistant', content: assistantContent });
                    
                    if (sessionReturned && !currentSessionId) {
                        currentSessionId = body.session_id;
                        await loadSessions();
                    } else if (sessionReturned && currentSessionId) {
                        await saveCurrentSession();
                    }
                }
            } catch (error) {
                addMessage('system', 'Ошибка сети: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                loading.classList.remove('visible');
                messageInput.focus();
            }
        }

        async function handleSlashCommand(text) {
            const parts = text.split(' ', 2);
            const cmd = parts[0].toLowerCase();
            const arg = parts[1] || '';
            
            if (cmd === '/fix') {
                const msg = currentSelectedFilePath
                    ? `Исправь ошибки в файле: ${currentSelectedFilePath}\n\n${arg}`
                    : `Исправь ошибки в выделенном коде:\n\n${arg || 'Нужно проанализировать и исправить ошибки в текущем проекте.'}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/explain') {
                const msg = currentSelectedFilePath
                    ? `Объясни подробно что делает файл: ${currentSelectedFilePath}\n\n${arg}`
                    : `Объясни что делает этот код:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/test') {
                const msg = currentSelectedFilePath
                    ? `Напиши unit-тесты для файла: ${currentSelectedFilePath}\n\n${arg}`
                    : `Напиши тесты для этого кода:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/docs') {
                const msg = currentSelectedFilePath
                    ? `Добавь docstring и документацию для файла: ${currentSelectedFilePath}\n\n${arg}`
                    : `Добавь документацию к этому коду:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/refactor') {
                const msg = currentSelectedFilePath
                    ? `Рефактори файл: ${currentSelectedFilePath} — улучши читаемость и производительность\n\n${arg}`
                    : `Рефактори этот код:\n\n${arg}`;
                messageInput.value = msg;
                sendMessage();
            } else if (cmd === '/inspector') {
                messageInput.value = text;
                sendMessage();
            } else if (cmd === '/run') {
                runTerminalCommand(arg);
            } else if (cmd === '/docx') {
                downloadDocx(arg);
            } else if (cmd === '/apply') {
                applySelectedFile(arg);
            } else {
                messageInput.value = text;
                sendMessage();
            }
        }

        async function applySelectedFile(arg) {
            const filepath = arg || currentSelectedFilePath;
            if (!filepath) {
                addMessage('system', 'Укажите файл: /apply path/to/file.py');
                return;
            }
            addMessage('system', 'Генерация изменений для ' + filepath + '...');
            try {
                const response = await fetch('/api/files/read/?path=' + encodeURIComponent(filepath));
                const data = await response.json();
                if (data.error) {
                    addMessage('system', 'Файл не найден: ' + filepath);
                    return;
                }
                const oldContent = data.content;
                conversationHistory.push({
                    role: 'user',
                    content: 'Пожалуйста, предоставь изменённую версию файла ' + filepath + '. Верни только новый содержимое файла в блоке кода. Не включай никаких объяснений.'
                });
                
                const resp = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: currentModel,
                        messages: conversationHistory,
                        temperature: 0.2,
                        stream: false,
                        session_id: currentSessionId
                    })
                });
                const chatData = await resp.json();
                if (chatData.error) {
                    addMessage('system', 'Ошибка: ' + chatData.error);
                    return;
                }
                
                conversationHistory.push({ role: 'assistant', content: chatData.content });
                
                // Extract code block
                const codeMatch = chatData.content.match(/```(?:\w+)?\n([\s\S]*?)```/);
                if (codeMatch) {
                    const newContent = codeMatch[1];
                    addMessage('system', '✅ Изменения готовы для ' + filepath + '. Проверьте diff ниже.');
                    await showDiff(oldContent, newContent, filepath);
                } else {
                    addMessage('system', 'Не удалось извлечь код из ответа. Ответ был: ' + chatData.content.substring(0, 200));
                }
            } catch (error) {
                addMessage('system', 'Ошибка: ' + error.message);
            }
        }

        async function runTerminalCommand(command) {
            const outputEl = document.getElementById('terminal-output');
            outputEl.style.display = 'block';
            outputEl.textContent = '$ ' + command + '\n\n';
            sendBtn.disabled = true;
            try {
                const response = await fetch('/api/command/run/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: command })
                });
                const data = await response.json();
                if (data.output) outputEl.textContent += data.output;
                if (data.error) outputEl.textContent += (data.output ? '\n' : '') + '❌ ' + data.error;
                if (data.returncode !== undefined && data.returncode !== 0) {
                    outputEl.textContent += '\n\nProcess exited with code ' + data.returncode;
                }
            } catch (error) {
                outputEl.textContent += '❌ Network error: ' + error.message;
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function downloadDocx(arg) {
            const filename = arg || 'report.docx';
            const historyStr = conversationHistory.map(m => m.role + ': ' + m.content).join('\n\n');
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/api/docx/generate/';
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'csrfmiddlewaretoken';
            input.value = '';
            const contentInput = document.createElement('input');
            contentInput.type = 'hidden';
            contentInput.name = 'content';
            contentInput.value = historyStr || 'No content';
            const titleInput = document.createElement('input');
            titleInput.type = 'hidden';
            titleInput.name = 'title';
            titleInput.value = 'Chat Report';
            const nameInput = document.createElement('input');
            nameInput.type = 'hidden';
            nameInput.name = 'filename';
            nameInput.value = filename;
            form.appendChild(input);
            form.appendChild(contentInput);
            form.appendChild(titleInput);
            form.appendChild(nameInput);
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }

        messageInput.addEventListener('input', function() {
            this.style.height = '48px';
            this.style.height = this.scrollHeight + 'px';
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        modelSelect.addEventListener('change', (e) => {
            if (currentSessionId) {
                saveCurrentSession();
            }
            currentModel = e.target.value;
            conversationHistory = [];
            chatMessages.innerHTML = '';
            currentSessionId = null;
            loadSessions();
        });

        createSessionBtn.addEventListener('click', createSession);
        
        toggleFilePanelBtn.addEventListener('click', toggleFilePanel);
        searchFilesBtn.addEventListener('click', toggleSearchFiles);
        fileViewerClose.addEventListener('click', () => fileViewer.classList.remove('visible'));
        document.getElementById('file-viewer-add-context').addEventListener('click', addFileToContext);
        diffViewerClose.addEventListener('click', () => diffViewer.classList.remove('visible'));
        diffApplyBtn.addEventListener('click', applyCurrentDiff);
        diffRejectBtn.addEventListener('click', () => diffViewer.classList.remove('visible'));
        searchFilesInput.addEventListener('input', (e) => filterFileTree(e.target.value));
        
        // Workspace modal handlers
        const workspaceModal = document.getElementById('workspace-modal');
        const workspacePathInput = document.getElementById('workspace-path-input');
        const workspaceFolderInput = document.getElementById('workspace-folder-input');
        const browseFolderBtn = document.getElementById('browse-folder-btn');
        const workspaceApplyBtn = document.getElementById('workspace-apply-btn');
        const workspaceCancelBtn = document.getElementById('workspace-cancel-btn');
        const workspaceError = document.getElementById('workspace-error');
        const workspaceSuccess = document.getElementById('workspace-success');
        const currentWorkspacePath = document.getElementById('current-workspace-path');
        
        function showWorkspaceModal() {
            workspaceModal.style.display = 'flex';
            workspaceError.style.display = 'none';
            workspaceSuccess.style.display = 'none';
            loadCurrentWorkspace();
        }
        
        function hideWorkspaceModal() {
            workspaceModal.style.display = 'none';
            workspacePathInput.value = '';
            workspaceError.style.display = 'none';
            workspaceSuccess.style.display = 'none';
        }
        
        async function loadCurrentWorkspace() {
            try {
                const response = await fetch('/api/workspace/get/');
                const data = await response.json();
                currentWorkspacePath.textContent = data.path;
                workspacePathInput.value = data.path;
            } catch (error) {
                currentWorkspacePath.textContent = 'Не удалось загрузить';
            }
        }
        
        browseFolderBtn.addEventListener('click', () => {
            workspaceFolderInput.click();
        });
        
        workspaceFolderInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                const firstFile = e.target.files[0];
                const folderPath = firstFile.webkitRelativePath.split('/')[0];
                workspacePathInput.value = folderPath;
            }
        });
        
        workspaceApplyBtn.addEventListener('click', async () => {
            const path = workspacePathInput.value.trim();
            if (!path) {
                workspaceError.textContent = 'Введите путь к папке';
                workspaceError.style.display = 'block';
                return;
            }
            
            workspaceApplyBtn.disabled = true;
            workspaceApplyBtn.textContent = 'Применение...';
            workspaceError.style.display = 'none';
            workspaceSuccess.style.display = 'none';
            
            try {
                const response = await fetch('/api/workspace/set/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ path: path })
                });
                const data = await response.json();
                
                if (data.success) {
                    workspaceSuccess.textContent = '✅ Рабочая папка изменена на: ' + data.path;
                    workspaceSuccess.style.display = 'block';
                    currentWorkspacePath.textContent = data.path;
                    
                    setTimeout(() => {
                        hideWorkspaceModal();
                        loadFileTree();
                    }, 1500);
                } else {
                    workspaceError.textContent = '❌ ' + data.error;
                    workspaceError.style.display = 'block';
                }
            } catch (error) {
                workspaceError.textContent = '❌ Ошибка: ' + error.message;
                workspaceError.style.display = 'block';
            } finally {
                workspaceApplyBtn.disabled = false;
                workspaceApplyBtn.textContent = 'Применить';
            }
        });
        
        workspaceCancelBtn.addEventListener('click', hideWorkspaceModal);
        
        workspaceModal.addEventListener('click', (e) => {
            if (e.target === workspaceModal) {
                hideWorkspaceModal();
            }
        });
        
        document.getElementById('set-workspace-btn').addEventListener('click', showWorkspaceModal);
        
        logoutBtn.addEventListener('click', async () => {
            if (currentSessionId) {
                await saveCurrentSession();
            }
            try {
                await fetch('/logout/', {
                    method: 'POST'
                });
                window.location.href = '/login/';
            } catch (error) {
                window.location.href = '/login/';
            }
        });

        // Directory load modal handlers
        const loadDirModal = document.getElementById('load-dir-modal');
        const loadDirPath = document.getElementById('load-dir-path');
        const loadDirMaxFiles = document.getElementById('load-dir-max-files');
        const loadDirMaxSize = document.getElementById('load-dir-max-size');
        const loadDirLoadBtn = document.getElementById('load-dir-load-btn');
        const loadDirCancelBtn = document.getElementById('load-dir-cancel-btn');
        const loadDirError = document.getElementById('load-dir-error');
        const loadDirSuccess = document.getElementById('load-dir-success');
        const loadDirProgress = document.getElementById('load-dir-progress');
        const loadDirProgressBar = document.getElementById('load-dir-progress-bar');
        const loadDirProgressText = document.getElementById('load-dir-progress-text');
        let isDirLoading = false;
        let loadedDirPaths = new Set();

        function showLoadDirModal() {
            loadDirModal.style.display = 'flex';
            loadDirError.style.display = 'none';
            loadDirSuccess.style.display = 'none';
            loadDirProgress.style.display = 'none';
            loadDirPath.value = '';
        }

        function hideLoadDirModal() {
            loadDirModal.style.display = 'none';
            isDirLoading = false;
        }

        async function loadDirectoryIntoContext() {
            if (isDirLoading) return;
            
            const dirPath = loadDirPath.value.trim();
            if (!dirPath) {
                loadDirError.textContent = 'Введите путь к директории';
                loadDirError.style.display = 'block';
                return;
            }

            isDirLoading = true;
            loadDirLoadBtn.disabled = true;
            loadDirLoadBtn.textContent = 'Загрузка...';
            loadDirError.style.display = 'none';
            loadDirSuccess.style.display = 'none';
            loadDirProgress.style.display = 'block';
            loadDirProgressBar.style.width = '30%';
            loadDirProgressText.textContent = 'Отправка запроса...';

            try {
                const response = await fetch('/api/files/load-dir/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        path: dirPath,
                        max_files: parseInt(loadDirMaxFiles.value),
                        max_total_size_mb: parseInt(loadDirMaxSize.value)
                    })
                });

                loadDirProgressBar.style.width = '70%';
                loadDirProgressText.textContent = 'Обработка ответа...';

                const data = await response.json();

                if (data.error) {
                    loadDirError.textContent = '❌ ' + data.error;
                    loadDirError.style.display = 'block';
                    loadDirProgress.style.display = 'none';
                    return;
                }

                // Add all files to context
                let addedCount = 0;
                for (const file of data.files) {
                    if (!selectedFilesForContext.includes(file.path)) {
                        selectedFilesForContext.push(file.path);
                        loadedDirPaths.add(dirPath);
                        addedCount++;
                    }
                }

                loadDirProgressBar.style.width = '100%';
                loadDirProgressText.textContent = 'Готово!';

                updateContextBadge();
                
                loadDirSuccess.textContent = `✅ Загружено ${addedCount} файлов из "${dirPath}" (всего в контексте: ${selectedFilesForContext.length})`;
                loadDirSuccess.style.display = 'block';

                setTimeout(() => {
                    hideLoadDirModal();
                }, 2000);

            } catch (error) {
                loadDirError.textContent = '❌ Ошибка: ' + error.message;
                loadDirError.style.display = 'block';
                loadDirProgress.style.display = 'none';
            } finally {
                isDirLoading = false;
                loadDirLoadBtn.disabled = false;
                loadDirLoadBtn.textContent = 'Загрузить';
            }
        }

        loadDirLoadBtn.addEventListener('click', loadDirectoryIntoContext);
        loadDirCancelBtn.addEventListener('click', hideLoadDirModal);
        loadDirModal.addEventListener('click', (e) => {
            if (e.target === loadDirModal) {
                hideLoadDirModal();
            }
        });
        
        document.getElementById('load-dir-btn').addEventListener('click', showLoadDirModal);

        checkStatus();
        initWorkspaceInfo();
    </script>
</body>
</html>
